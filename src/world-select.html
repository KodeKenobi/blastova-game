  function drawMap(canvas, waypoints, isLocked) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width  = canvas.offsetWidth  || 240;
    const h = canvas.height = canvas.offsetHeight || 260;
    ctx.fillStyle = isLocked ? '#12161a' : '#c8d8e0';
    ctx.fillRect(0, 0, w, h);
    if (!isLocked) {
      ctx.fillStyle = '#8a9ab0';
      [[0.3,0.7,32],[0.78,0.2,22],[0.55,0.5,18]].forEach(([rx,ry,r])=>{
        ctx.beginPath(); ctx.arc(w*rx, h*ry, r, 0, Math.PI*2); ctx.fill();
      });
      ctx.fillStyle = '#1a3a1a';
      [[0.15,0.75],[0.18,0.82],[0.52,0.42],[0.57,0.48],[0.85,0.22],[0.88,0.28]].forEach(([rx,ry])=>{
        ctx.beginPath(); ctx.arc(w*rx, h*ry, 9, 0, Math.PI*2); ctx.fill();
      });
    }
    // Auto-fit: stretch waypoints to fill canvas with padding
    const pad = 18;
    const xs = waypoints.map(p => p.x), ys = waypoints.map(p => p.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const rangeX = maxX - minX || 1, rangeY = maxY - minY || 1;
    const pts = waypoints.map(p => ({
      x: pad + ((p.x - minX) / rangeX) * (w - pad * 2),
      y: pad + ((p.y - minY) / rangeY) * (h - pad * 2)
    }));
    // road shoulder
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    pts.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
    ctx.strokeStyle = isLocked ? '#1e252c' : '#374151';
    ctx.lineWidth = 16; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
    // road surface
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    pts.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
    ctx.strokeStyle = isLocked ? '#2d3741' : '#6b7280';
    ctx.lineWidth = 11; ctx.stroke();
    // center line
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    pts.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
    ctx.strokeStyle = isLocked ? '#1e252c' : '#22c55e';
    ctx.lineWidth = 2; ctx.setLineDash(isLocked ? [] : [6,6]); ctx.stroke();
    ctx.setLineDash([]);
    // entry/exit dots
    if (!isLocked) {
      ctx.fillStyle = '#22c55e'; ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, 5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(pts[pts.length-1].x, pts[pts.length-1].y, 5, 0, Math.PI*2); ctx.fill();
    }
  }

  function buildUI(skipFrontStage) {
    const scene = window.__tdScene;
    if (!scene) return;

    const logWorldSelectState = (event, details) => {
      try {
        const page = window.location.pathname + window.location.search;
        console.log('[WorldSelect]', {
          event,
          page,
          loggedIn: !!window.__supabaseUserId,
          userId: window.__supabaseUserId || null,
          skipFrontStage: !!skipFrontStage,
          ...(details || {}),
        });
      } catch (_) {}
    };
    logWorldSelectState('build_ui_start');

    if (window.__tdWorldSelectMatchmakingState) {
      closeWorldSelectMatchmaking(window.__tdWorldSelectMatchmakingState);
      window.__tdWorldSelectMatchmakingState = null;
    }
    document.querySelectorAll('.ws-mm-modal').forEach((node) => node.remove());

    const cmdData = scene.loadCommanderData ? scene.loadCommanderData() : { level: 1 };
    const worlds = window.WORLDS_DATA || [];
    const clearedIds = cmdData.worldsCleared || [];
    let authSessionSyncInFlight = null;
    const syncAuthSessionState = async () => {
      if (window.__supabaseUserId) return;
      if (!authSessionSyncInFlight) {
        authSessionSyncInFlight = Promise.resolve()
          .then(() => window.__tdAuthApi?.getSession?.())
          .then((session) => {
            if (session?.user) {
              window.__supabaseUserId = session.user.id;
              window.__supabaseUserEmail = session.user.email;
              window.__supabaseUserName = session.user.user_metadata?.full_name || session.user.email || 'Player';
              window.__supabaseUserAvatar = session.user.user_metadata?.avatar_url || null;
            }
            if (typeof window.__refreshAuthUI === 'function') window.__refreshAuthUI();
          })
          .catch(() => {})
          .finally(() => {
            authSessionSyncInFlight = null;
          });
      }
      return authSessionSyncInFlight;
    };

    const container = document.getElementById('worldSelectContainer');
    container.querySelectorAll('.tier-row').forEach(row => {
      if (typeof row._cleanupResize === 'function') row._cleanupResize();
    });
    container.innerHTML = '';
    const authRedirectParams = new URLSearchParams(window.location.search || '');
    if (authRedirectParams.get('showFrontStage') === '1') {
      skipFrontStage = false;
      logWorldSelectState('oauth_return_forced_front_stage');
      authRedirectParams.delete('showFrontStage');
      const cleanSearch = authRedirectParams.toString();
      window.history.replaceState({}, '', window.location.pathname + (cleanSearch ? '?' + cleanSearch : '') + (window.location.hash || ''));
    }
    applyOverlayPlatformAttributes();
    const matchPrefs = loadWorldSelectModePrefs();
    const defaultWorldId = Number(worlds?.[0]?.id ?? 0);
    const matchmaking = {
      socket: null,
      connected: false,
      browsing: false,
      matched: false,
      match: null,
      pendingLaunch: false,
      selectedWorldId: defaultWorldId,
      selectedDifficulty: 'normal',
      selectedTransport: normalizeMatchmakingTransport(matchPrefs.multiplayerVariant),
      hostWorldSelected: false,
      selectedRole: '',
      roleOnly: false,
      stats: {
        online: 0,
        openLobbies: 0,
      },
      lobbies: [],
      selectedLobbyId: '',
      hostingLobby: false,
      pendingLobbyCreate: false,
      autoFindOnRole: false,
      statsPollTimer: 0,
      reconnectTimer: 0,
      waitFxTimer: 0,
      waitSince: 0,
      onlineSearchSince: 0,
      preStartTimer: 0,
      preStartCountdownActive: false,
      preStartCountdownEndsAt: 0,
      preStartCountdownSeconds: 0,
      preStartAutoStartHost: false,
      preStartLaunchConfig: null,
      inviteQrText: '',
      ui: null,
    };
    window.__tdWorldSelectMatchmakingState = matchmaking;

    const getRoleName = (role) => {
      if (role === 'enemyCommander') return 'Attack';
      if (role === 'defender') return 'Defend';
      return '';
    };

    const normalizeWorldId = (worldId) => {
      const numericWorldId = Number(worldId);
      if (!Number.isFinite(numericWorldId)) return defaultWorldId;
      return (worlds || []).some((world) => Number(world.id) === numericWorldId)
        ? numericWorldId
        : defaultWorldId;
    };

    const updateMatchmakingSubtitle = () => {
      if (!matchmaking.ui?.sub) return;
      const transportLabel = matchmaking.selectedTransport === 'nearby' ? 'Nearby' : 'Online';
      if (!matchmaking.connected) {
        matchmaking.ui.sub.textContent = transportLabel + ': connecting...';
        return;
      }
      if (matchmaking.matched) {
        const isHost = !!matchmaking.match?.host;
        matchmaking.ui.sub.textContent = (transportLabel + ': ') + (isHost
          ? 'Host picks world, then starts the match.'
          : 'Host will pick world and start the match.');
        return;
      }
      if (!matchmaking.selectedRole) {
        matchmaking.ui.sub.textContent = transportLabel + ': choose role to begin matchmaking.';
        return;
      }
      if (matchmaking.hostingLobby) {
        matchmaking.ui.sub.textContent = transportLabel + ': searching for opponent...';
        return;
      }
      matchmaking.ui.sub.textContent = transportLabel + ': waiting for opponent';
    };

    const WAITING_HOST_LINES = [
      'Awaiting host launch window.',
      'Host is selecting battlefield.',
      'Synchronizing deployment channels.',
      'Finalizing command uplink.'
    ];

    const WAITING_HOST_TIPS = [
      { tag: 'ECO', title: 'Resource Discipline', text: 'Spend early credits on efficiency over burst.' },
      { tag: 'LANE', title: 'Chokepoint Focus', text: 'Place your first tower near path overlap when possible.' },
      { tag: 'CLUTCH', title: 'Emergency Buffer', text: 'Save one quick reaction option for sudden leaks.' },
      { tag: 'COUNTER', title: 'Armor Counterplay', text: 'Track armored waves and prep counter damage.' }
    ];

    const isWaitingForHostStart = () => {
      return !!(matchmaking.connected && matchmaking.matched && matchmaking.match && !matchmaking.match.host && !matchmaking.pendingLaunch);
    };

    const isKickoffPreviewVisible = () => {
      return !!(matchmaking.connected
        && matchmaking.matched
        && matchmaking.match
        && matchmaking.hostWorldSelected
        && matchmaking.preStartCountdownActive
        && !matchmaking.pendingLaunch);
    };

    const stopPreStartCountdown = () => {
      if (matchmaking.preStartTimer) {
        clearInterval(matchmaking.preStartTimer);
        matchmaking.preStartTimer = 0;
      }
      matchmaking.preStartCountdownActive = false;
      matchmaking.preStartCountdownEndsAt = 0;
      matchmaking.preStartCountdownSeconds = 0;
      matchmaking.preStartAutoStartHost = false;
    };

    const updatePreStartLaunchConfig = () => {
      const match = matchmaking.match;
      if (!match) return;
      matchmaking.preStartLaunchConfig = {
        matchId: String(match.matchId || ''),
        peerId: String(match.peerId || ''),
        role: match.role === 'defender' ? 'defender' : 'enemyCommander',
        host: !!match.host,
        world: normalizeWorldId(matchmaking.selectedWorldId),
        difficulty: String(matchmaking.selectedDifficulty || 'normal'),
      };
    };

    const triggerHostMatchStart = () => {
      if (!matchmaking.match || !matchmaking.socket || matchmaking.socket.readyState !== WebSocket.OPEN) return false;
      if (!matchmaking.match.host) return false;

      const payload = {
        type: 'match_start',
        matchId: matchmaking.match.matchId,
        world: normalizeWorldId(matchmaking.selectedWorldId),
        difficulty: String(matchmaking.selectedDifficulty || 'normal'),
      };

      try {
        matchmaking.socket.send(JSON.stringify(payload));
      } catch (_) {
        return false;
      }

      window.__tdPregameMultiplayer = {
        socket: matchmaking.socket,
        wsUrl: resolveWorldSelectMatchWsUrl(matchmaking.selectedTransport),
        matchId: matchmaking.match.matchId,
        peerId: matchmaking.match.peerId,
        role: matchmaking.match.role,
        host: true,
      };

      stopPreStartCountdown();
      matchmaking.pendingLaunch = true;
      renderMatchmakingUi();
      launchWorld(normalizeWorldId(matchmaking.selectedWorldId), String(matchmaking.selectedDifficulty || 'normal'), {
        mode: 'multiplayer',
        multiplayerRole: matchmaking.match.role,
      });
      return true;
    };

    const launchMatchedWorldFromCountdown = () => {
      if (matchmaking.pendingLaunch) return false;
      const config = matchmaking.preStartLaunchConfig || (matchmaking.match ? {
        matchId: String(matchmaking.match.matchId || ''),
        peerId: String(matchmaking.match.peerId || ''),
        role: matchmaking.match.role === 'defender' ? 'defender' : 'enemyCommander',
        host: !!matchmaking.match.host,
        world: normalizeWorldId(matchmaking.selectedWorldId),
        difficulty: String(matchmaking.selectedDifficulty || 'normal'),
      } : null);
      if (!config) return false;

      window.__tdPregameMultiplayer = {
        socket: matchmaking.socket || null,
        wsUrl: resolveWorldSelectMatchWsUrl(matchmaking.selectedTransport),
        matchId: config.matchId,
        peerId: config.peerId,
        role: config.role,
        host: !!config.host,
      };

      stopPreStartCountdown();
      matchmaking.pendingLaunch = true;
      renderMatchmakingUi();
      launchWorld(normalizeWorldId(config.world), String(config.difficulty || 'normal'), {
        mode: 'multiplayer',
        multiplayerRole: config.role,
      });
      return true;
    };

    const startPreStartCountdown = (autoStartHost) => {
      if (!matchmaking.match || matchmaking.pendingLaunch) return;

      if (matchmaking.preStartTimer) {
        clearInterval(matchmaking.preStartTimer);
        matchmaking.preStartTimer = 0;
      }

      matchmaking.preStartAutoStartHost = !!(autoStartHost && matchmaking.match.host);
      matchmaking.preStartCountdownActive = true;
      matchmaking.preStartCountdownEndsAt = Date.now() + 5000;
      matchmaking.preStartCountdownSeconds = 5;
      updatePreStartLaunchConfig();
      renderMatchmakingUi();

      matchmaking.preStartTimer = window.setInterval(() => {
        if (!matchmaking.preStartCountdownActive) {
          stopPreStartCountdown();
          return;
        }

        const remainingMs = Math.max(0, matchmaking.preStartCountdownEndsAt - Date.now());
        const remainingSeconds = Math.max(0, Math.ceil(remainingMs / 1000));
        if (remainingSeconds !== matchmaking.preStartCountdownSeconds) {
          matchmaking.preStartCountdownSeconds = remainingSeconds;
          renderMatchmakingUi();
        }

        if (remainingMs <= 0) {
          const hostShouldAutoStart = !!(matchmaking.match?.host && matchmaking.preStartAutoStartHost);
          stopPreStartCountdown();
          if (hostShouldAutoStart) {
            const didStart = triggerHostMatchStart();
            if (!didStart) {
              launchMatchedWorldFromCountdown();
            }
          } else {
            renderMatchmakingUi();
            window.setTimeout(() => {
              if (!matchmaking.matched || !matchmaking.hostWorldSelected) return;
              if (matchmaking.pendingLaunch) return;
              launchMatchedWorldFromCountdown();
            }, 900);
          }
        }
      }, 120);
    };

    const formatElapsedClock = (totalSeconds) => {
      const safeSeconds = Math.max(0, Number(totalSeconds || 0));
      const minutes = Math.floor(safeSeconds / 60);
      const seconds = safeSeconds % 60;
      const minText = String(minutes).padStart(2, '0');
      const secText = String(seconds).padStart(2, '0');
      return minText + ':' + secText;
    };

    const updateWaitingHostGamificationUi = () => {
      const ui = matchmaking.ui;
      if (!ui || !ui.waitFx) return;
      if (!isWaitingForHostStart()) {
        ui.waitFx.classList.remove('active');
        return;
      }

      if (!matchmaking.waitSince) {
        matchmaking.waitSince = Date.now();
      }

      const elapsedSeconds = Math.floor((Date.now() - matchmaking.waitSince) / 1000);
      const lineIndex = Math.floor(elapsedSeconds / 2) % WAITING_HOST_LINES.length;
      const tipIndex = Math.floor(elapsedSeconds / 4) % WAITING_HOST_TIPS.length;

      ui.waitFx.classList.add('active');
      if (ui.waitFxText) {
        ui.waitFxText.textContent = WAITING_HOST_LINES[lineIndex];
      }
      if (ui.waitFxTime) {
        ui.waitFxTime.textContent = formatElapsedClock(elapsedSeconds);
      }
      if (ui.waitFxTipTag) {
        ui.waitFxTipTag.textContent = String(WAITING_HOST_TIPS[tipIndex].tag || 'TIP');
      }
      if (ui.waitFxTipTitle) {
        ui.waitFxTipTitle.textContent = String(WAITING_HOST_TIPS[tipIndex].title || 'Tactical Insight');
      }
      if (ui.waitFxTipText) {
        ui.waitFxTipText.textContent = String(WAITING_HOST_TIPS[tipIndex].text || 'Stay ready.');
      }
    };

    const stopWaitingHostGamificationLoop = () => {
      if (matchmaking.waitFxTimer) {
        clearInterval(matchmaking.waitFxTimer);
        matchmaking.waitFxTimer = 0;
      }
      matchmaking.waitSince = 0;
      if (matchmaking.ui?.waitFx) {
        matchmaking.ui.waitFx.classList.remove('active');
      }
    };

    const ensureWaitingHostGamificationLoop = () => {
      if (!isWaitingForHostStart()) {
        stopWaitingHostGamificationLoop();
        return;
      }
      if (!matchmaking.waitSince) {
        matchmaking.waitSince = Date.now();
      }
      updateWaitingHostGamificationUi();
      if (matchmaking.waitFxTimer) return;
      matchmaking.waitFxTimer = window.setInterval(() => {
        if (!isWaitingForHostStart()) {
          stopWaitingHostGamificationLoop();
          return;
        }
        updateWaitingHostGamificationUi();
      }, 300);
    };

    const requestLobbyList = () => {
      if (!matchmaking.socket || matchmaking.socket.readyState !== WebSocket.OPEN) return;
      if (!matchmaking.selectedRole) return;
      try {
        matchmaking.socket.send(JSON.stringify({
          type: 'lobby_subscribe',
          rolePreference: matchmaking.selectedRole,
          playerLevel: Math.max(1, Number(cmdData.level || 1)),
        }));
      } catch (_) {}
    };

    const requestLobbyStats = () => {
      if (!matchmaking.socket || matchmaking.socket.readyState !== WebSocket.OPEN) return;
      try {
        matchmaking.socket.send(JSON.stringify({ type: 'lobby_stats_request' }));
      } catch (_) {}
    };

    const stopStatsPolling = () => {
      if (!matchmaking.statsPollTimer) return;
      clearInterval(matchmaking.statsPollTimer);
      matchmaking.statsPollTimer = 0;
    };

    const startStatsPolling = () => {
      stopStatsPolling();
      matchmaking.statsPollTimer = window.setInterval(() => {
        if (!matchmaking.connected) return;
        requestLobbyStats();
      }, 900);
    };

    const clearReconnectTimer = () => {
      if (!matchmaking.reconnectTimer) return;
      clearTimeout(matchmaking.reconnectTimer);
      matchmaking.reconnectTimer = 0;
    };

    const triggerAutoFindOpponent = () => {
      if (!matchmaking.socket || matchmaking.socket.readyState !== WebSocket.OPEN) return false;
      if (!matchmaking.selectedRole) return false;
      if (matchmaking.hostingLobby) return false;
      if (matchmaking.matched) return false;

      matchmaking.hostingLobby = false;
      matchmaking.matched = false;
      matchmaking.match = null;

      const candidateLobby = String(
        matchmaking.selectedLobbyId
        || matchmaking.lobbies?.[0]?.lobbyId
        || matchmaking.lobbies?.[0]?.id
        || ''
      );

      if (candidateLobby) {
        matchmaking.hostingLobby = true;
        matchmaking.pendingLobbyCreate = false;
        matchmaking.autoFindOnRole = false;
        try {
          matchmaking.socket.send(JSON.stringify({
            type: 'lobby_join',
            lobbyId: candidateLobby,
            rolePreference: matchmaking.selectedRole,
            playerLevel: Math.max(1, Number(cmdData.level || 1)),
          }));
        } catch (_) {}
        requestLobbyStats();
        renderMatchmakingUi();
        return true;
      }

      matchmaking.hostingLobby = true;
      matchmaking.pendingLobbyCreate = true;
      matchmaking.autoFindOnRole = false;
      try {
        matchmaking.socket.send(JSON.stringify({
          type: 'lobby_create',
          hostRole: matchmaking.selectedRole,
          playerLevel: Math.max(1, Number(cmdData.level || 1)),
        }));
      } catch (_) {}
      requestLobbyStats();
      renderMatchmakingUi();
      return true;
    };

    const scheduleAutoFindFallback = () => {
      setTimeout(() => {
        if (!matchmaking.autoFindOnRole) return;
        if (!matchmaking.connected || !matchmaking.selectedRole) return;
        if (matchmaking.matched || matchmaking.hostingLobby) return;
        triggerAutoFindOpponent();
      }, 220);
    };

    const showSelectionAnnouncement = (el, text) => {
      if (!el || !text) return;
      if (el.dataset.selectionAnnouncementText === text) return;
      el.dataset.selectionAnnouncementText = text;
      if (el._announcementFadeTimer) {
        clearTimeout(el._announcementFadeTimer);
        el._announcementFadeTimer = 0;
      }
      el.style.visibility = 'visible';
      el.style.opacity = '1';
      el.textContent = text;
      el.classList.remove('is-fading');
      void el.offsetWidth;
      el.classList.add('is-fading');
      el._announcementFadeTimer = window.setTimeout(() => {
        el.style.visibility = 'hidden';
      }, 950);
    };

    const renderMatchmakingUi = () => {
      const selectedRoleName = getRoleName(matchmaking.selectedRole);
      const currentWorldId = normalizeWorldId(matchmaking.selectedWorldId);
      const selectedWorld = (worlds || []).find((world) => Number(world.id) === currentWorldId) || worlds?.[0];
      const selectedWorldName = String(selectedWorld?.name || ('World ' + String(currentWorldId)));
      const selectedWorldAnnouncement = selectedWorldName + ' selected';
      const mapNumber = ((Number(selectedWorld?.pathIndex || 0) % 12) + 1);
      const mapSrc = '/assets/maps/tower-defense/LAIMap' + String(mapNumber) + '.jpg';

      if (!matchmaking.ui) return;
      const ui = matchmaking.ui;
      const connected = !!matchmaking.connected;
      const matched = !!matchmaking.matched;
      const isHost = !!matchmaking.match?.host;
      ui.onlineValue.textContent = String(matchmaking.stats.online || 0);
      const optimisticOpenLobbies = matchmaking.pendingLobbyCreate ? 1 : 0;
      const queueCount = Math.max(0, Number(matchmaking.stats.openLobbies || 0) + optimisticOpenLobbies);
      ui.levelGapValue.textContent = 'LV ' + String(cmdData.level || 1);
      const playerLevelDisplay = 'LV ' + String(cmdData.level || 1).padStart(2, '0');
      if (ui.onlineBoardLevelValue) ui.onlineBoardLevelValue.textContent = playerLevelDisplay;
      if (ui.nearbyBoardLevelValue) ui.nearbyBoardLevelValue.textContent = playerLevelDisplay;
      if (ui.worldStatValue) {
        const isPendingHostWorld = matched && !isHost && !matchmaking.hostWorldSelected;
        if (isPendingHostWorld) {
          ui.worldStatValue.textContent = 'PENDING';
        } else {
          const safeWorldId = Number.isFinite(Number(currentWorldId)) ? Number(currentWorldId) : 0;
          ui.worldStatValue.textContent = safeWorldId > 0 ? ('WORLD ' + String(safeWorldId)) : 'PENDING';
        }
      }
      if (ui.worldDiffValue) {
        ui.worldDiffValue.textContent = String(matchmaking.selectedDifficulty || 'normal').toUpperCase();
      }

      const activeRole = (matchmaking.match?.role || matchmaking.selectedRole || 'defender');
      const roleTag = activeRole === 'enemyCommander' ? 'ATTACK' : 'DEFENSE';
      const kickoffVisible = isKickoffPreviewVisible();
      const worldControlsEnabled = !matched || isHost;
      const roleSelected = !!matchmaking.selectedRole;
      const searchingOnline = !matchmaking.roleOnly
        && roleSelected
        && !matched;
      const canJoin = connected && roleSelected && !matched && !matchmaking.hostingLobby && !!matchmaking.selectedLobbyId;

      if (searchingOnline) {
        if (!matchmaking.onlineSearchSince) matchmaking.onlineSearchSince = Date.now();
      } else {
        matchmaking.onlineSearchSince = 0;
      }

      if (ui.transportNearbyBtn) {
        ui.transportNearbyBtn.classList.toggle('active', matchmaking.selectedTransport === 'nearby');
      }
      if (ui.transportOnlineBtn) {
        ui.transportOnlineBtn.classList.toggle('active', matchmaking.selectedTransport === 'online');
      }
      if (ui.onlineTabOnline) {
        ui.onlineTabOnline.classList.toggle('active', matchmaking.selectedTransport === 'online');
      }
      if (ui.onlineTabNearby) {
        ui.onlineTabNearby.classList.toggle('active', matchmaking.selectedTransport === 'nearby');
      }
      if (ui.tacticalOnlineContent) {
        ui.tacticalOnlineContent.style.display = matchmaking.selectedTransport === 'online' ? '' : 'none';
      }
      if (ui.tacticalNearbyContent) {
        ui.tacticalNearbyContent.style.display = matchmaking.selectedTransport === 'nearby' ? '' : 'none';
      }
      if (ui.nearbyInput) {
        ui.nearbyInput.value = resolveWorldSelectMatchWsUrl(matchmaking.selectedTransport);
        ui.nearbyInput.placeholder = matchmaking.selectedTransport === 'nearby'
          ? '192.168.4.1:8787 or code'
          : 'matchmaker URL (optional)';
      }
      if (ui.nearbyCode) {
        ui.nearbyCode.textContent = encodeNearbyCode(resolveWorldSelectMatchWsUrl(matchmaking.selectedTransport)) || '-';
      }
      if (ui.shareCodeRow) {
        ui.shareCodeRow.style.display = matchmaking.selectedTransport === 'nearby' ? '' : 'none';
      }
      renderMatchmakingInviteQr(ui, matchmaking);

      if (searchingOnline) {
        const elapsedSeconds = Math.floor((Date.now() - (matchmaking.onlineSearchSince || Date.now())) / 1000);
        if (ui.waitFxText) {
          ui.waitFxText.textContent = matchmaking.hostingLobby
            ? 'Broadcasting your lobby to online players.'
            : 'Scanning online lobbies for an opponent.';
        }
        if (ui.waitFxTime) {
          ui.waitFxTime.textContent = formatElapsedClock(elapsedSeconds);
        }
        if (ui.waitFxTipTag) {
          ui.waitFxTipTag.textContent = 'ONLINE';
        }
        if (ui.waitFxTipTitle) {
          ui.waitFxTipTitle.textContent = 'Queue Activity: ' + String(queueCount);
        }
        if (ui.waitFxTipText) {
          ui.waitFxTipText.textContent = 'Players online: ' + String(matchmaking.stats.online || 0) + '. Keep this window open while we match you.';
        }
      }

      if (ui.waitingLabel) {
        ui.waitingLabel.textContent = matched ? 'Status' : 'Queue';
      }
      if (ui.waitingIcon) {
        ui.waitingIcon.textContent = matched ? (isHost ? '⌂' : '⏱') : '☰';
      }
      if (ui.openLobbiesValue) {
        if (matched) {
          if (matchmaking.pendingLaunch) {
            ui.openLobbiesValue.textContent = 'STARTING ' + roleTag;
          } else {
            ui.openLobbiesValue.textContent = (isHost ? 'HOST ' : 'READY ') + roleTag;
          }
        } else {
          ui.openLobbiesValue.textContent = String(queueCount);
        }
      }

      if (ui.worldStatCard) {
        ui.worldStatCard.style.display = matched ? '' : 'none';
      }
      if (ui.worldStatCard && ui.worldStatCard.parentElement) {
        ui.worldStatCard.parentElement.style.gridTemplateColumns = matched
          ? 'repeat(4, minmax(0, 1fr))'
          : 'repeat(3, minmax(0, 1fr))';
      }

      if (!roleSelected) {
        matchmaking.selectedLobbyId = '';
      }

      if (ui.stage) {
        ui.stage.style.display = (matched && isHost) ? 'grid' : 'none';
      }
      if (ui.modal) {
        ui.modal.classList.toggle('match-ready', matched && isHost);
      }
      if (ui.roleWrap) {
        ui.roleWrap.style.display = 'none';
      }

      if (ui.worldList) {
        ui.worldList.querySelectorAll('[data-mm-world-id]').forEach((el) => {
          const worldId = normalizeWorldId(el.getAttribute('data-mm-world-id'));
          el.classList.toggle('active', worldId === currentWorldId);
          el.classList.toggle('disabled', !worldControlsEnabled);
        });
      }

      if (ui.mapPreview) {
        ui.mapPreview.innerHTML = '<img src="' + mapSrc + '" alt="World preview" />';
      }
      if (ui.waitFxTipMap) {
        ui.waitFxTipMap.style.backgroundImage = 'linear-gradient(180deg, rgba(12, 7, 29, 0.35), rgba(9, 6, 24, 0.55)), url("' + mapSrc + '")';
      }
      if (ui.pickedWorldWrap) {
        const showPickedWorld = matched && !isHost && !!matchmaking.hostWorldSelected;
        ui.pickedWorldWrap.style.display = showPickedWorld ? 'grid' : 'none';
        if (showPickedWorld) {
          if (ui.pickedWorldLabel) {
            showSelectionAnnouncement(ui.pickedWorldLabel, selectedWorldAnnouncement);
          }
          if (ui.pickedWorldMap) {
            ui.pickedWorldMap.innerHTML = '<img src="' + mapSrc + '" alt="Host selected world preview" />';
          }
        }
      }

      if (ui.kickoffWrap) {
        ui.kickoffWrap.style.display = kickoffVisible ? 'grid' : 'none';
      }
      if (ui.kickoffTitle && kickoffVisible) {
        showSelectionAnnouncement(ui.kickoffTitle, selectedWorldAnnouncement);
      }
      if (ui.kickoffMap && kickoffVisible) {
        ui.kickoffMap.innerHTML = '<img src="' + mapSrc + '" alt="Selected world preview" />';
      }
      if (ui.kickoffCountdown && kickoffVisible) {
        const seconds = Math.max(0, Number(matchmaking.preStartCountdownSeconds || 0));
        ui.kickoffCountdown.textContent = seconds > 0
          ? ('CONTINUING IN ' + String(seconds))
          : 'CONTINUING...';
      }

      const roleOnly = !!matchmaking.roleOnly;
      const nearbyMode = false;
      if (ui.modal) {
        ui.modal.classList.toggle('role-only', roleOnly);
        ui.modal.classList.remove('nearby-mode', 'nearby-overhaul');
      }
      if (roleOnly) {
        const head = ui.modal.querySelector('.ws-mm-head');
        if (head) head.style.display = 'none';
        if (ui.sub) ui.sub.style.display = 'none';
        if (ui.transportRow) ui.transportRow.style.display = 'none';
        if (ui.nearbyWrap) ui.nearbyWrap.style.display = 'none';
        if (ui.kickoffWrap) ui.kickoffWrap.style.display = 'none';
        if (ui.waitFx) ui.waitFx.style.display = 'none';
        const stats = ui.modal.querySelector('.ws-mm-stats');
        if (stats) stats.style.display = 'none';
        if (ui.stage) ui.stage.style.display = 'none';
        const actions = ui.modal.querySelector('.ws-mm-actions');
        if (actions) actions.style.display = 'none';
        if (ui.roleWrap) ui.roleWrap.style.display = 'block';
        if (ui.roleOnlyCloseBtn) ui.roleOnlyCloseBtn.style.display = 'inline-flex';
      } else {
        const head = ui.modal.querySelector('.ws-mm-head');
        if (head) head.style.display = '';
        if (ui.sub) ui.sub.style.display = '';
        if (ui.transportRow) ui.transportRow.style.display = matched ? 'none' : '';
        if (ui.nearbyWrap) ui.nearbyWrap.style.display = matchmaking.selectedTransport === 'nearby' ? '' : 'none';
        if (ui.kickoffWrap) ui.kickoffWrap.style.display = kickoffVisible ? 'grid' : 'none';
        if (ui.waitFx) ui.waitFx.style.display = '';
        const stats = ui.modal.querySelector('.ws-mm-stats');
        if (stats) stats.style.display = '';
        if (ui.stage) ui.stage.style.display = (matched && isHost) ? 'grid' : 'none';
        const actions = ui.modal.querySelector('.ws-mm-actions');
        if (actions) actions.style.display = '';
        if (ui.roleOnlyCloseBtn) ui.roleOnlyCloseBtn.style.display = 'none';
      }

      ui.roleDefend.classList.toggle('active', matchmaking.selectedRole === 'defender');
      ui.roleAttack.classList.toggle('active', matchmaking.selectedRole === 'enemyCommander');

      const canFind = connected && roleSelected && !matched && !matchmaking.pendingLaunch && !matchmaking.hostingLobby;
      if (ui.startBtn) {
        ui.startBtn.disabled = !(matched && isHost) || matchmaking.pendingLaunch;
        ui.startBtn.style.display = (matched && isHost) ? 'inline-flex' : 'none';
      }

      if (matched && matchmaking.match) {
        const roleName = getRoleName(matchmaking.match.role);
        const hostText = isHost
          ? 'You are host. Pick world, then press START MATCH.'
          : 'Opponent is host. Waiting for host to choose world and start.';
        if (ui.state) {
          ui.state.textContent = 'Match ready vs LV ' + String(matchmaking.match.opponentLevel || '?') + '. You are ' + roleName + '. ' + hostText;
        }
      } else if (!connected) {
        if (ui.state) ui.state.textContent = 'Connecting...';
      } else if (!roleSelected) {
        if (ui.state) ui.state.textContent = '';
      } else if (matchmaking.hostingLobby) {
        if (ui.state) ui.state.textContent = '';
      } else {
        if (ui.state) ui.state.textContent = '';
      }

      updateMatchmakingSubtitle();
      if (ui.modal) {
        ui.modal.classList.toggle('waiting-host', isWaitingForHostStart());
        ui.modal.classList.toggle('kickoff-preview', kickoffVisible);
        ui.modal.classList.toggle('searching-online', searchingOnline);
        const onlineBoard = ui.modal.querySelector('.ws-online-board');
        const panel = ui.modal.querySelector('.ws-mm-panel');
        if (panel && onlineBoard) {
          // Only manage the legacy online-board child here. Sibling panels
          // (transport row, invite/QR wrap, role picker, stage, stats, etc.)
          // already have their visibility decided above based on matched/
          // roleOnly state — resetting them to '' here would undo that and
          // make hidden setup UI reappear once a match starts.
          if (searchingOnline) {
            Array.from(panel.children).forEach((child) => {
              child.style.display = child === onlineBoard ? 'grid' : 'none';
            });
          } else {
            onlineBoard.style.display = 'none';
          }
          if (searchingOnline) {
            const fitKey = window.innerWidth + 'x' + window.innerHeight;
            if (panel.dataset.onlineBoardFitKey !== fitKey) {
              panel.dataset.onlineBoardFitKey = fitKey;
              onlineBoard.style.zoom = '1';
              requestAnimationFrame(() => {
                const bounds = onlineBoard.getBoundingClientRect();
                const fitScale = Math.min(1, (window.innerWidth - 32) / bounds.width, (window.innerHeight - 24) / bounds.height);
                const scale = Math.max(0.35, fitScale * 0.9);
                onlineBoard.style.zoom = scale.toFixed(3);
                panel.style.width = Math.ceil((bounds.width * scale) + 36) + 'px';
              });
            }
          } else {
            onlineBoard.style.removeProperty('zoom');
            panel.style.removeProperty('width');
            delete panel.dataset.onlineBoardFitKey;
          }
        }
      }
      ensureWaitingHostGamificationLoop();
    };

    const handleMatchmakingMessage = (message) => {
      if (!message || typeof message !== 'object') return;

      if (message.type === 'lobby_stats') {
        matchmaking.stats = {
          online: Math.max(0, Number(message.online || 0)),
          openLobbies: Math.max(0, Number(message.openLobbies || 0)),
        };
        renderMatchmakingUi();
        return;
      }

      if (message.type === 'lobby_list') {
        const nextList = Array.isArray(message.lobbies) ? message.lobbies : [];
        matchmaking.lobbies = nextList;
        if (!matchmaking.selectedRole) {
          matchmaking.selectedLobbyId = '';
          renderMatchmakingUi();
          return;
        }
        const selectedExists = nextList.some((entry) => String(entry.lobbyId || entry.id || '') === String(matchmaking.selectedLobbyId || ''));
        if (!selectedExists) {
          matchmaking.selectedLobbyId = nextList[0] ? String(nextList[0].lobbyId || nextList[0].id || '') : '';
        }
        if (matchmaking.autoFindOnRole && !matchmaking.matched && !matchmaking.hostingLobby) {
          triggerAutoFindOpponent();
        }
        renderMatchmakingUi();
        return;
      }

      if (message.type === 'lobby_created') {
        matchmaking.hostingLobby = true;
        matchmaking.pendingLobbyCreate = false;
        matchmaking.selectedLobbyId = String(message?.lobby?.lobbyId || '');
        requestLobbyStats();
        renderMatchmakingUi();
        return;
      }

      if (message.type === 'lobby_join_failed') {
        matchmaking.hostingLobby = false;
        matchmaking.pendingLobbyCreate = false;
        requestLobbyStats();
        renderMatchmakingUi();
        return;
      }

      if (message.type === 'matched') {
        matchmaking.hostingLobby = false;
        matchmaking.pendingLobbyCreate = false;
        matchmaking.matched = true;
        matchmaking.match = {
          matchId: String(message.matchId || ''),
          role: message.role === 'enemyCommander' ? 'enemyCommander' : 'defender',
          peerId: String(message.peerId || ''),
          host: !!message.host,
          opponentLevel: Math.max(1, Number(message.opponentLevel || 1)),
        };
        matchmaking.hostWorldSelected = !!matchmaking.match.host;
        stopPreStartCountdown();
        matchmaking.selectedRole = matchmaking.match.role;
        updatePreStartLaunchConfig();
        matchPrefs.mode = 'multiplayer';
        matchPrefs.multiplayerRole = matchmaking.selectedRole;
        matchPrefs.multiplayerVariant = matchmaking.selectedTransport;
        saveWorldSelectModePrefs(matchPrefs);
        if (matchmaking.match.host && matchmaking.socket && matchmaking.socket.readyState === WebSocket.OPEN) {
          try {
            matchmaking.socket.send(JSON.stringify({
              type: 'match_world_selected',
              matchId: matchmaking.match.matchId,
              world: normalizeWorldId(matchmaking.selectedWorldId),
              difficulty: String(matchmaking.selectedDifficulty || 'normal'),
            }));
          } catch (_) {}
          startPreStartCountdown(true);
        }
        requestLobbyStats();
        renderMatchmakingUi();
        return;
      }

      if (message.type === 'match_world_selected') {
        if (!matchmaking.match) return;
        matchmaking.selectedWorldId = normalizeWorldId(message.world ?? matchmaking.selectedWorldId);
        matchmaking.selectedDifficulty = String(message.difficulty || matchmaking.selectedDifficulty || 'normal');
        matchmaking.hostWorldSelected = true;
        updatePreStartLaunchConfig();
        startPreStartCountdown(false);
        renderMatchmakingUi();
        return;
      }

      if (message.type === 'match_start') {
        const world = normalizeWorldId(message.world ?? matchmaking.selectedWorldId);
        const difficulty = String(message.difficulty || matchmaking.selectedDifficulty || 'normal');
        if (!matchmaking.match || !matchmaking.socket) return;

        matchmaking.selectedWorldId = world;
        matchmaking.selectedDifficulty = difficulty;
        matchmaking.hostWorldSelected = true;
        stopPreStartCountdown();

        window.__tdPregameMultiplayer = {
          socket: matchmaking.socket,
          wsUrl: resolveWorldSelectMatchWsUrl(matchmaking.selectedTransport),
          matchId: matchmaking.match.matchId,
          peerId: matchmaking.match.peerId,
          role: matchmaking.match.role,
          host: !!matchmaking.match.host,
        };

        matchmaking.pendingLaunch = true;
        renderMatchmakingUi();
        launchWorld(world, difficulty, {
          mode: 'multiplayer',
          multiplayerRole: matchmaking.match.role,
        });
      }
    };

    const ensureMatchmakingSocket = () => {
      if (matchmaking.socket && (matchmaking.socket.readyState === WebSocket.OPEN || matchmaking.socket.readyState === WebSocket.CONNECTING)) {
        return;
      }

      let socket;
      try {
        socket = new WebSocket(resolveWorldSelectMatchWsUrl(matchmaking.selectedTransport));
      } catch (_) {
        matchmaking.connected = false;
        renderMatchmakingUi();
        return;
      }

      matchmaking.socket = socket;
      matchmaking.connected = false;
      matchmaking.browsing = true;
      matchmaking.matched = false;
      matchmaking.match = null;
      matchmaking.hostingLobby = false;
      renderMatchmakingUi();

      socket.onopen = () => {
        if (matchmaking.socket !== socket) return;
        clearReconnectTimer();
        matchmaking.connected = true;
        requestLobbyList();
        if (matchmaking.autoFindOnRole && matchmaking.selectedRole) {
          scheduleAutoFindFallback();
        }
        try {
          socket.send(JSON.stringify({ type: 'lobby_stats_request' }));
        } catch (_) {}
        startStatsPolling();
        renderMatchmakingUi();
      };

      socket.onmessage = (event) => {
        let message = null;
        try {
          message = JSON.parse(String(event?.data || '{}'));
        } catch (_) {
          return;
        }
        handleMatchmakingMessage(message);
      };

      socket.onerror = () => {
        if (matchmaking.socket !== socket) return;
        matchmaking.connected = false;
        renderMatchmakingUi();
      };

      socket.onclose = () => {
        if (matchmaking.socket !== socket) return;
        matchmaking.socket = null;
        matchmaking.connected = false;
        matchmaking.browsing = false;
        stopStatsPolling();
        clearReconnectTimer();
        matchmaking.hostingLobby = false;
        matchmaking.lobbies = [];
        matchmaking.selectedLobbyId = '';
        if (!matchmaking.pendingLaunch && !matchmaking.preStartCountdownActive) {
          matchmaking.matched = false;
          matchmaking.match = null;
        }
        stopPreStartCountdown();
        if (!matchmaking.pendingLaunch) {
          matchmaking.reconnectTimer = window.setTimeout(() => {
            matchmaking.reconnectTimer = 0;
            ensureMatchmakingSocket();
          }, 650);
        }
        renderMatchmakingUi();
      };
    };

    const ensureMatchmakingModal = () => {
      if (matchmaking.ui) return matchmaking.ui;

      const modal = document.createElement('div');
      modal.className = 'ws-mm-modal';
      modal.innerHTML = [
        '<div class="ws-mm-panel">',
        '  <div class="ws-mm-head">',
        '    <h3 class="ws-mm-title">Multiplayer Queue</h3>',
        '    <button class="ws-mm-close" data-mm="close" aria-label="Close matchmaking">X</button>',
        '  </div>',
        '  <p class="ws-mm-sub" data-mm="sub">Waiting for Opponent</p>',
        '  <div class="ws-mm-role-row" data-mm="transport-row" style="margin-top:2px;">',
        '    <button class="ws-mm-role-btn" data-mm="transport-nearby"><span class="ws-mm-role-icon" aria-hidden="true">📡</span><span class="ws-mm-role-main">Nearby</span><span class="ws-mm-role-sub">No internet, same area</span></button>',
        '    <button class="ws-mm-role-btn" data-mm="transport-online"><span class="ws-mm-role-icon ws-mm-role-icon-online" aria-hidden="true"></span><span class="ws-mm-role-main">Online</span><span class="ws-mm-role-sub">Internet matchmaking</span></button>',
        '  </div>',
        '  <div class="ws-mm-role-wrap ws-mm-nearby-deck" data-mm="nearby-wrap" style="display:block; margin-top:8px; padding-top:8px;">',
        '    <div class="ws-mm-nearby-shell" data-mm="invite-wrap">',
        '      <div class="ws-mm-nearby-left">',
        '        <div class="ws-mm-nearby-hero"><span class="ws-mm-nearby-chip">LAN UPLINK</span><span class="ws-mm-nearby-chip ws-mm-nearby-chip-soft">LOCAL</span></div>',
        '        <div class="ws-mm-block-title">Scan To Join</div>',
        '        <div class="ws-mm-qr-shell"><div class="ws-mm-qr-code" data-mm="invite-qr-code"></div></div>',
        '      </div>',
        '      <div class="ws-mm-nearby-right ws-mm-share-actions">',
        '        <button class="ws-mm-btn" data-mm="invite-copy">Copy</button>',
        '        <button class="ws-mm-btn" data-mm="invite-share">Share</button>',
        '        <div class="ws-mm-invite-hint" data-mm="invite-text">Share through any installed app.</div>',
        '      </div>',
        '    </div>',
        '  </div>',
        '  <div class="ws-mm-kickoff" data-mm="kickoff">',
        '    <p class="ws-mm-kickoff-title" data-mm="kickoff-title">World selected</p>',
        '    <div class="ws-mm-kickoff-map" data-mm="kickoff-map"></div>',
        '    <div class="ws-mm-kickoff-countdown" data-mm="kickoff-countdown">CONTINUING IN 5</div>',
        '  </div>',
        '  <div class="ws-mm-waitfx" data-mm="waitfx" aria-live="polite" aria-atomic="true">',
        '    <div class="ws-mm-waitfx-line"><span class="ws-mm-waitfx-badge">UPLINK</span><span class="ws-mm-waitfx-text" data-mm="waitfx-text">Awaiting host launch window.</span><span class="ws-mm-waitfx-time" data-mm="waitfx-time">00:00</span></div>',
        '    <div class="ws-mm-waitfx-track"><span class="ws-mm-waitfx-bar" aria-hidden="true"></span></div>',
        '    <div class="ws-mm-waitfx-tip" data-mm="waitfx-tip"><span class="ws-mm-waitfx-tip-tag" data-mm="waitfx-tip-tag">LANE</span><span class="ws-mm-waitfx-tip-body"><span class="ws-mm-waitfx-tip-title" data-mm="waitfx-tip-title">Chokepoint Focus</span><span class="ws-mm-waitfx-tip-text" data-mm="waitfx-tip-text">Place your first tower near path overlap when possible.</span></span></div>',
        '    <div class="ws-mm-picked-world" data-mm="picked-world"><div class="ws-mm-picked-world-label" data-mm="picked-world-label">World selected</div><div class="ws-mm-picked-world-map" data-mm="picked-world-map"></div></div>',

      const getCtx = () => {
        if (!ctx || ctx.state === 'closed') ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      };
      const out = (node, delay, duration) => {
        node.connect(getCtx().destination);
        node.start(getCtx().currentTime + (delay || 0));
        node.stop(getCtx().currentTime + (delay || 0) + duration);
      };
      const osc = (type, freq, gainVal, delay, dur, freqEnd, gainEnd) => {
        const c = getCtx(), o = c.createOscillator(), g = c.createGain();
        o.type = type; o.connect(g); g.connect(c.destination);
        o.frequency.setValueAtTime(freq, c.currentTime + (delay||0));
        if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, c.currentTime + (delay||0) + dur);
        g.gain.setValueAtTime(gainVal, c.currentTime + (delay||0));
        g.gain.exponentialRampToValueAtTime(gainEnd || 0.001, c.currentTime + (delay||0) + dur);
        o.start(c.currentTime + (delay||0));
        o.stop(c.currentTime + (delay||0) + dur);
      };
      return {
        hover() {
          try { osc('sine', 900, 0.07, 0, 0.055, 500, 0.001); } catch(e){}
        },
        select(colorKey) {
          try {
            const c = getCtx();

            osc('sine',     380, 0.22, 0.04, 0.55, 1400, 0.001);

        const cards = grid.querySelectorAll('.ui-card');

            return;
          }
          const availableDesktopHeight = Math.max(250, Math.round(window.innerHeight - grid.getBoundingClientRect().top - 74));
          const desktopLargeH = Math.max(296, Math.min(336, availableDesktopHeight));
          const largeH = compactLandscape ? 205 : (mobileViewport ? 230 : desktopLargeH);
          const peekH = compactLandscape ? 155 : (mobileViewport ? 165 : Math.max(246, largeH - 54));
          const largeMapH = compactLandscape ? 96 : (mobileViewport ? 188 : Math.max(156, Math.min(188, largeH - 126)));
          const peekMapH = compactLandscape ? 96 : (mobileViewport ? Math.max(118, largeMapH - 30) : Math.max(132, largeMapH - 24));
          const peekOffset = Math.max(0, Math.round((largeH - peekH) / 2));
          const maxPrimaryIdx = Math.max(0, cards.length - 2);
          const primaryIdx = Number.isFinite(idx) ? Math.max(0, Math.min(maxPrimaryIdx, idx)) : 0;
          const desktopPeekMode = !mobileViewport && !compactLandscape;
          const cardFiveIdx = cards.length - 1;

          const cardFiveButtonsVisible = desktopPeekMode && cardFiveIdx >= 0 && (primaryIdx + 1) === cardFiveIdx;

          if (mobileViewport) {

        const applyCardSizing = () => {

          const compactLandscape = window.matchMedia('(orientation: landscape) and (max-height: 500px)').matches;

              ? Math.floor((containerW - gap * 1.2) / (compactLandscape ? 2.55 : 2.75))

            const railInset = Math.max(72, Math.round((containerW - cardW) / 2 - gap + 34));
            grid.style.paddingLeft = String(railInset) + 'px';
            grid.style.paddingRight = String(railInset) + 'px';
          } else if (!mobileViewport && !compactLandscape) {
            const desktopInset = compactMode
              ? Math.max(46, Math.round(containerW * 0.06))
              : Math.max(88, Math.round(containerW * 0.11));

            grid.style.paddingRight = String(desktopInset) + 'px';

            grid.style.paddingLeft = '0px';
            grid.style.paddingRight = '0px';

          prevBtn.style.display = compactMode ? 'none' : '';
          nextBtn.style.display = compactMode ? 'none' : '';

          grid._cardW = cardW;
          grid._gap = gap;

          const step = (grid._cardW || 0) + (grid._gap || 0);
          const maxScrollLeft = Math.max(0, grid.scrollWidth - grid.clientWidth);
          const maxScrollableIdx = step > 0 ? Math.max(0, Math.floor((maxScrollLeft + step * 0.2) / step)) : 0;

          const maxIdx = desktopShowcaseMode ? Math.max(0, cards.length - 1) : cards.length - 1;
          currentIdx = Math.max(0, Math.min(maxIdx, currentIdx));
          const scrollIdx = compactMode ? Math.min(currentIdx, maxScrollableIdx) : currentIdx;
          const offset = scrollIdx * (cardW + gap);

          if (!desktopShowcaseMode && compactMode && scrollIdx === maxScrollableIdx && cards.length >= 2) {

          const maxScrollLeft = Math.max(0, grid.scrollWidth - grid.clientWidth);
          const atScrollEnd = grid.scrollLeft >= (maxScrollLeft - Math.max(2, step * 0.2));
          const derived = !desktopShowcaseMode && atScrollEnd && cards.length >= 2
            ? Math.max(0, cards.length - 2)
            : Math.max(0, Math.min(cards.length - 1, Math.round(grid.scrollLeft / step)));
          const maxIdx = desktopShowcaseMode ? Math.max(0, cards.length - 1) : Math.max(0, cards.length - 2);
          return Math.max(0, Math.min(maxIdx, derived));
        };

        const settleScrollState = () => {
          if (!isCompactCarouselMode()) return;
          const step = (grid._cardW || 0) + (grid._gap || 0);
          if (step <= 0) return;

          currentIdx = deriveCurrentIdxFromScroll();
          updateDots(currentIdx);

          const maxScrollLeft = Math.max(0, grid.scrollWidth - grid.clientWidth);
          const targetLeft = Math.max(0, Math.min(maxScrollLeft, currentIdx * step));
          if (Math.abs(grid.scrollLeft - targetLeft) > 2) {
            grid.scrollTo({ left: targetLeft, behavior: 'smooth' });
          }

          applyMobileCardStates(currentIdx);
        };

        const scheduleScrollSettle = (delayMs = 120) => {
          if (scrollEndTimer) clearTimeout(scrollEndTimer);
          scrollEndTimer = setTimeout(settleScrollState, delayMs);
        };

        const scrollTo = (idx) => {
          const compactMode = isCompactCarouselMode();
          const mobileViewport = isMobileViewport();
          const compactLandscape = window.matchMedia('(orientation: landscape) and (max-height: 500px)').matches;
          const desktopShowcaseMode = compactMode && !mobileViewport && !compactLandscape;
          const step = (grid._cardW || 0) + (grid._gap || 0);
          const maxScrollLeft = Math.max(0, grid.scrollWidth - grid.clientWidth);
          const maxScrollableIdx = step > 0 ? Math.max(0, Math.floor((maxScrollLeft + step * 0.2) / step)) : 0;
          const maxIdx = compactMode
            ? (desktopShowcaseMode ? Math.max(0, cards.length - 1) : Math.max(0, cards.length - 2))
            : cards.length - 1;
          const targetIdx = Math.max(0, Math.min(maxIdx, idx));
          const scrollIdx = compactMode ? Math.min(targetIdx, maxScrollableIdx) : targetIdx;
          const offset = scrollIdx * step;
          grid.scrollTo({ left: offset, behavior: 'smooth' });
          currentIdx = compactMode
            ? Math.max(0, Math.min(maxIdx, scrollIdx))
            : scrollIdx;
          updateDots(currentIdx);
          applyMobileCardStates(currentIdx);
          scheduleScrollSettle(140);
        };

        prevBtn.onclick = () => scrollTo(currentIdx - 1);
        nextBtn.onclick = () => scrollTo(currentIdx + 1);

        const onGridScroll = () => {
          if (!isCompactCarouselMode()) return;
          if (scrollRaf) return;
          scrollRaf = requestAnimationFrame(() => {
            scrollRaf = null;
            const mobileViewport = isMobileViewport();
            const compactLandscape = window.matchMedia('(orientation: landscape) and (max-height: 500px)').matches;
            // Only the desktop "showcase" carousel needs a continuous
            // per-frame update (it scales/dims cards based on fractional
            // scroll progress). Mobile/peek card states are fixed per index,
            // so re-running applyMobileCardStates (classList + multiple
            // inline style writes across every card) on every single scroll
            // frame — even when the active index hasn't changed — was pure
            // wasted layout/style work fighting the native momentum scroll,
            // which is what made horizontal scrolling feel flaky on mobile.
            const desktopShowcaseMode = !mobileViewport && !compactLandscape;
            const derived = deriveCurrentIdxFromScroll();
            const idxChanged = derived !== currentIdx;
            if (idxChanged) {
              currentIdx = derived;
              updateDots(currentIdx);
            }
            if (desktopShowcaseMode || idxChanged) {
              applyMobileCardStates(currentIdx);
            }
            scheduleScrollSettle(120);
          });
        };
        grid.addEventListener('scroll', onGridScroll, { passive: true });

        // Store ref for keyboard nav
        tierRow._scrollTo = scrollTo;
        tierRow._getCurrentIdx = () => currentIdx;

        window.addEventListener('resize', applyCardSizing);
        tierRow._cleanupResize = () => {
          window.removeEventListener('resize', applyCardSizing);
          grid.removeEventListener('scroll', onGridScroll);
          if (scrollEndTimer) clearTimeout(scrollEndTimer);
        };
      }); // end requestAnimationFrame
    }); // end tiers.forEach

    // Keyboard: arrows scroll the topmost visible carousel
    document.removeEventListener('keydown', window._carouselKeyHandler);
    window._carouselKeyHandler = (e) => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      const rows = container.querySelectorAll('.tier-row');
      for (const row of rows) {
        const rect = row.getBoundingClientRect();
        if (rect.top < window.innerHeight && rect.bottom > 0 && row._scrollTo) {
          row._scrollTo(row._getCurrentIdx() + (e.key === 'ArrowLeft' ? -1 : 1));
          e.preventDefault(); break;
        }
      }
    };
    document.addEventListener('keydown', window._carouselKeyHandler);
  }

  function countClearedPrevTier(tierNum, worlds, clearedIds) {
    return worlds.filter(w => w.tier === (tierNum - 1) && clearedIds.includes(w.id)).length;
  }

  function getPathWaypoints(world) {
    const scene = window.__tdScene;
    if (!scene || typeof window.PATH_LAYOUT_TEMPLATES_DATA === 'undefined') {
      // Fallback: south-detour-style zigzag
      return [{x:40,y:145},{x:140,y:145},{x:140,y:468},{x:478,y:468},{x:478,y:198},{x:748,y:198},{x:748,y:424},{x:960,y:424}];
    }
    // Return raw game coordinates — drawMap will auto-fit them to the canvas
    return window.PATH_LAYOUT_TEMPLATES_DATA[world.pathIndex] || [];
  }

  function getGlobalDifficulty() {
    try { return localStorage.getItem('tdGlobalDifficulty') || 'normal'; } catch(e) { return 'normal'; }
  }

  function launchWorld(worldId, difficulty, modePrefs = null) {
    const scene = window.__tdScene;
    if (!scene) return;
    const normalizedWorldIndex = Math.max(0, Math.floor(Number(worldId) || 0));
    const gameContainer = document.getElementById('game-container');
    if (gameContainer) gameContainer.style.visibility = 'visible';
    const effectivePrefs = modePrefs || loadWorldSelectModePrefs();
    const selectedMode = effectivePrefs?.mode === 'vsAiDefense' || effectivePrefs?.mode === 'vsAiAttack'
      ? effectivePrefs.mode
      : (effectivePrefs?.mode === 'vsAi'
        ? (effectivePrefs?.multiplayerRole === 'enemyCommander' ? 'vsAiAttack' : 'vsAiDefense')
        : (effectivePrefs?.mode === 'multiplayer' ? 'multiplayer' : 'singleplayer'));
    const multiplayerRole = selectedMode === 'singleplayer' || selectedMode === 'vsAiDefense'
      ? 'defender'
      : (selectedMode === 'vsAiAttack' ? 'enemyCommander' : (effectivePrefs?.multiplayerRole === 'defender' ? 'defender' : 'enemyCommander'));
    const multiplayerVariant = selectedMode === 'singleplayer'
      ? 'nearby'
      : (effectivePrefs?.multiplayerVariant === 'ai'
        ? 'ai'
        : normalizeMatchmakingTransport(effectivePrefs?.multiplayerVariant));
    try {
      console.log('[WorldSelect]', {
        event: 'launch_world',
        page: window.location.pathname + window.location.search,
        loggedIn: !!window.__supabaseUserId,
        worldId: normalizedWorldIndex,
        difficulty,
        selectedMode,
        multiplayerRole,
        multiplayerVariant,
      });
    } catch (_) {}
    try {
      sessionStorage.setItem('tdActiveWorld', JSON.stringify({
        worldIndex: normalizedWorldIndex,
        difficulty: difficulty,
        selectedMode,
        multiplayerRole,
        multiplayerVariant,
      }));
    } catch (_) {}
    document.getElementById('world-select-overlay').style.display = 'none';
    var bg = document.getElementById('ws-parallax-bg');
    if (bg) bg.style.display = 'none';
    if (scene.scene && typeof scene.scene.restart === 'function') {
      scene.scene.restart();
    } else {
      scene.gameState.selectedWorldIndex = normalizedWorldIndex;
      scene.gameState.selectedDifficulty = difficulty;
      scene.gameState.selectedMode = selectedMode;
      scene.gameState.multiplayerRole = multiplayerRole;
      scene.gameState.multiplayerVariant = multiplayerVariant;
      scene.gameState.wave = 1;
      scene.gameState.level = 1;
      scene.initializeGameplayAfterWorldSelection();
    }
    if (window.__game) window.__game.emit('game:started', true);
    window.__blastovaOnboarding?.notify(selectedMode === 'singleplayer' ? 'map-selected' : 'session-mode');
  }

  window.__showWorldSelect = function(opts) {
    buildUI(opts && opts.skipFrontStage);
    try {
      console.log('[WorldSelect]', {
        event: 'show_world_select_called',
        page: window.location.pathname + window.location.search,
        loggedIn: !!window.__supabaseUserId,
        skipFrontStage: !!(opts && opts.skipFrontStage),
      });
    } catch (_) {}
    applyOverlayPlatformAttributes();
    var ov = document.getElementById('world-select-overlay');
    var container = document.getElementById('worldSelectContainer');
    var bg = document.getElementById('ws-parallax-bg');
    if (ov) ov.scrollTop = 0;
    if (container) container.scrollTop = 0;
    ov.style.opacity = '0';
    ov.style.transition = 'opacity 0.5s ease';
    ov.style.display = 'block';
    if (bg) { bg.style.opacity = '0'; bg.style.transition = 'opacity 0.5s ease'; bg.style.display = 'block'; }
    setTimeout(function() {
      ov.style.opacity = '1';
      if (bg) bg.style.opacity = '1';
    }, 520);
  };

  window.__hideWorldSelect = function() {
    if (window.__tdWorldSelectMatchmakingState) {
      closeWorldSelectMatchmaking(window.__tdWorldSelectMatchmakingState);
      window.__tdWorldSelectMatchmakingState = null;
    }
    document.querySelectorAll('.ws-mm-modal').forEach((node) => node.remove());
    document.getElementById('world-select-overlay').style.display = 'none';
    var bg = document.getElementById('ws-parallax-bg');
    if (bg) bg.style.display = 'none';
  };
})();
</script>
