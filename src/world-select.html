<!-- World Selection UI — exact design from spec -->
<div id="world-select-overlay" style="display:none; position:fixed; inset:0; z-index:200; overflow:hidden;">

      letter-spacing: 2px; text-shadow: 0 0 8px rgba(255,215,0,0.5);

    @media (min-width: 1280px) {

        padding-left: max(48px, calc(env(safe-area-inset-left, 0px) + 48px));

    .ws-online-tabs { grid-template-columns: 290px 250px 1fr; gap: 0; }

    .ws-online-kicker { color: #c8b86b; font-family: 'BlackOpsOne', monospace; font-size: 14px; letter-spacing: 1px; }
    .ws-online-radar { position: relative; width: 220px; aspect-ratio: 1; margin: 18px auto; border: 1px solid rgba(164, 159, 84, 0.52); border-radius: 50%; display: grid; place-content: center; text-align: center; background: repeating-radial-gradient(circle, transparent 0 28px, rgba(136, 140, 71, 0.25) 29px 30px), linear-gradient(90deg, transparent 49.5%, rgba(136, 140, 71, 0.22) 50%, transparent 50.5%), linear-gradient(transparent 49.5%, rgba(136, 140, 71, 0.22) 50%, transparent 50.5%); box-shadow: inset 0 0 36px rgba(85, 91, 42, 0.16); }
    .ws-online-radar-sweep { position: absolute; inset: 0; overflow: hidden; border-radius: 50%; }
    .ws-online-radar-sweep::after { content: ''; position: absolute; width: 50%; height: 2px; left: 50%; top: 50%; transform-origin: left center; background: linear-gradient(90deg, rgba(82, 228, 255, .9), rgba(82, 228, 255, 0)); box-shadow: 0 0 12px rgba(82, 228, 255, .75); animation: ws-online-radar-sweep 2.6s linear infinite; }
    .ws-online-radar-pip { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #98f5ff; box-shadow: 0 0 12px #54def5; opacity: 0; animation: ws-online-radar-pip 2.6s ease-out infinite; }
    .ws-online-radar-pip.one { left: 31%; top: 27%; animation-delay: .45s; }
    .ws-online-radar-pip.two { left: 67%; top: 58%; animation-delay: 1.25s; }
    .ws-online-radar-pip.three { left: 43%; top: 74%; animation-delay: 2s; }
    .ws-online-radar-copy { position: relative; z-index: 1; display: grid; justify-items: center; gap: 5px; }
    .ws-online-radar-status { color: #74ddef; font-family: 'BlackOpsOne', monospace; font-size: 9px; letter-spacing: 1.2px; }

    .ws-online-map { height: 275px; margin-top: 14px; background: url('/assets/maps/tower-defense/LAIMap1.jpg') center/cover; border-bottom: 1px solid rgba(113,149,163,.22); }
    .ws-online-pending-art { width: 100%; height: 275px; margin-top: 14px; object-fit: contain; display: block; }
    .ws-online-world { padding: 12px 8px; font-family: 'BlackOpsOne', monospace; font-size: 20px; letter-spacing: 1px; }
    .ws-online-status { display: grid; gap: 12px; }
    .ws-online-stat { min-height: 120px; border: 1px solid rgba(113,149,163,.2); padding: 12px; display: grid; align-content: start; gap: 12px; }
    .ws-online-level { font-family: 'BlackOpsOne', monospace; font-size: 28px; text-align: center; padding: 22px 0; }
    .ws-online-local-qr { width: 174px; min-height: 174px; margin: 18px auto; display: grid; place-items: center; border: 1px solid rgba(82, 219, 242, 0.42); background: rgba(7, 22, 28, 0.88); }
    .ws-online-local-qr svg { width: 154px; height: 154px; background: #eafaff; padding: 5px; }
    .ws-online-local-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .ws-online-local-actions .ws-online-action { min-height: 46px; }
    .ws-online-footer { grid-template-columns: 140px 1fr 260px; align-items: center; }
    .ws-online-progress { min-height: 62px; display: grid; align-content: center; padding-left: 92px; border: 1px solid rgba(66, 168, 210, 0.32); background: #09141a; color: #9fc2ce; font-family: 'BlackOpsOne', monospace; font-size: 16px; letter-spacing: 1px; }
    .ws-online-cancel { color: #ff7666; border-color: rgba(197, 72, 57, 0.5); background: #1a0c0a; }

        background: linear-gradient(140deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0) 45%);
        opacity: 0.32;
      }

      .ws-mm-role-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 0 16px rgba(110, 180, 255, 0.34);
      }

      .ws-mm-role-btn[data-mm="role-def"] {
        border-color: rgba(84, 196, 255, 0.84);
        background: linear-gradient(180deg, rgba(18, 65, 111, 0.95), rgba(12, 34, 66, 0.96));
      }

      .ws-mm-role-btn[data-mm="role-attack"] {
        border-color: rgba(255, 115, 95, 0.84);
        background: linear-gradient(180deg, rgba(110, 36, 31, 0.95), rgba(66, 18, 17, 0.96));
        color: #ffd0c8;
      }

      .ws-mm-role-btn[data-mm="transport-nearby"] {
        border-color: rgba(180, 144, 84, 0.88);
        background: linear-gradient(180deg, rgba(82, 58, 30, 0.96), rgba(52, 35, 18, 0.98));
        color: #f2dfbf;
      }

      .ws-mm-role-btn[data-mm="transport-online"] {
        border-color: rgba(178, 99, 58, 0.88);
        background: linear-gradient(180deg, rgba(95, 45, 27, 0.96), rgba(58, 25, 14, 0.98));
        color: #ffd8bf;
      }

      .ws-mm-role-btn.active {
        border-color: rgba(218, 240, 255, 0.95);
        color: #fbfeff;
        box-shadow: 0 0 18px rgba(175, 219, 255, 0.48);
      }

      .ws-mm-role-btn[data-mm="role-attack"].active {
        box-shadow: 0 0 18px rgba(255, 123, 108, 0.46);
      }

      .ws-mm-role-btn[data-mm="transport-nearby"].active {
        border-color: rgba(236, 202, 141, 0.98);
        box-shadow: 0 0 18px rgba(206, 168, 100, 0.46);
        color: #fff2d9;
      }

      .ws-mm-role-btn[data-mm="transport-online"].active {
        border-color: rgba(235, 162, 122, 0.98);
        box-shadow: 0 0 18px rgba(206, 118, 77, 0.46);
        color: #ffe8d9;
      }

      .ws-mm-role-icon {
        font-size: 22px;
        line-height: 1;
      }

      .ws-mm-role-icon-online {
        width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 0;
        line-height: 1;
        position: relative;
      }

      .ws-mm-role-icon-online::before {
        content: '';
        width: 14px;
        height: 14px;
        border: 2px solid currentColor;
        border-radius: 999px;
        opacity: 0.9;
      }

      .ws-mm-role-icon-online::after {
        content: '';
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 999px;
        background: currentColor;
        box-shadow: -6px -2px 0 currentColor, 6px -2px 0 currentColor, 0 6px 0 currentColor;
      }

      .ws-mm-role-main {
        font-size: 18px;
        font-weight: 600;
        line-height: 1.1;
        letter-spacing: 1.2px;
      }

      .ws-mm-role-sub {
        font-size: 11px;
        color: rgba(226, 236, 247, 0.94);
        letter-spacing: 0.8px;
        line-height: 1.05;
      }

      .ws-mm-role-units {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 2px;
      }

      .ws-mm-role-unit {
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 999px;
        padding: 2px 7px;
        font-size: 10px;
        letter-spacing: 0.7px;
        background: rgba(8, 12, 24, 0.36);
      }

      .ws-mm-role-btn[data-mm="role-def"] .ws-mm-role-unit {
        border-color: rgba(124, 221, 255, 0.6);
      }

      .ws-mm-role-btn[data-mm="role-attack"] .ws-mm-role-unit {
        border-color: rgba(255, 157, 143, 0.58);
      }

      .ws-mm-state {
        min-height: 28px;
        border: 1px solid rgba(111, 139, 201, 0.58);
        border-radius: 9px;
        color: #b4dcff;
        background: linear-gradient(180deg, rgba(15, 22, 44, 0.86), rgba(12, 17, 35, 0.92));
        padding: 7px 10px;
        font-size: 11px;
        font-family: 'Teko', monospace;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        text-align: center;
      }

      .ws-mm-find {
        height: 54px;
        border-radius: 8px;
        border: 1px solid rgba(120, 211, 255, 0.96);
        background: linear-gradient(180deg, rgba(63, 167, 248, 0.95), rgba(43, 91, 219, 0.98));
        color: #fff5ff;
        font-family: 'BlackOpsOne', monospace;
        font-size: 16px;
        letter-spacing: 1.8px;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(87, 182, 255, 0.4);
      }

      .ws-mm-actions {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
      }

      .ws-mm-btn {
        height: 44px;
        min-width: 220px;
        width: 220px;
        border-radius: 8px;
        border: 1px solid rgba(122, 95, 194, 0.72);
        background: linear-gradient(180deg, rgba(32, 38, 67, 0.95), rgba(19, 24, 46, 0.95));
        color: #caa8f9;
        font-family: 'BlackOpsOne', monospace;
        font-size: 11px;
        letter-spacing: 1.6px;
        text-transform: uppercase;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 18px;
      }

      .ws-mm-btn[data-kind="danger"] {
        border-color: rgba(219, 82, 102, 0.86);
        background: linear-gradient(180deg, rgba(152, 36, 50, 0.98), rgba(103, 23, 34, 0.98));
        color: #ffd5df;
      }

      .ws-mm-btn:disabled,
      .ws-mm-find:disabled {
        opacity: 0.46;
        cursor: not-allowed;
        box-shadow: none;
      }

      @media (max-width: 700px) {
        .ws-mm-panel {
          width: min(100%, 560px);
          padding: 12px;
          gap: 8px;
        }

        .ws-mm-title {
          font-size: 29px;
        }

        .ws-mm-sub {
          font-size: 13px;
        }

        .ws-mm-sub::before,
        .ws-mm-sub::after {
          width: 28%;
        }

        .ws-mm-stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .ws-mm-lobby-list {
          grid-template-columns: 1fr;
        }

        .ws-mm-stat-value {
          font-size: 22px;
        }

        .ws-mm-stage {
          grid-template-columns: 1fr;
        }

        .ws-mm-world-list {
          max-height: 140px;
        }

        .ws-mm-map-col {
          min-height: 180px;
        }

        .ws-mm-map-preview {
          min-height: 164px;
        }

        .ws-mm-role-main {
          font-size: 32px;
        }

        .ws-mm-role-sub {
          font-size: 16px;
        }

        .ws-mm-find {
          font-size: 24px;
          height: 48px;
        }

        .ws-mm-btn {
          font-size: 20px;
          min-width: 100%;
          width: 100%;
        }
      }

      .ws-mp-presence {
        width: 100%;
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid rgba(102, 160, 218, 0.52);
        background: linear-gradient(180deg, rgba(11, 19, 36, 0.9), rgba(7, 13, 26, 0.9));
        border-radius: 8px;
        box-sizing: border-box;
        box-shadow: 0 0 24px rgba(0, 170, 255, 0.12);
      }

      .ws-mp-presence-left {
        display: grid;
        gap: 4px;
        min-width: 0;
      }

      .ws-mp-presence-title {
        margin: 0;
        color: #bfeaff;
        font-family: 'BlackOpsOne', monospace;
        font-size: 12px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }

      .ws-mp-presence-meta {
        margin: 0;
        color: rgba(153, 197, 228, 0.95);
        font-size: 11px;
        letter-spacing: 0.7px;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
      }

      .ws-mp-presence-role {
        margin: 0;
        color: #9edcff;
        font-size: 11px;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }

      .ws-mp-presence-btn {
        flex-shrink: 0;
        height: 34px;
        border-radius: 5px;
        border: 1px solid rgba(0, 195, 255, 0.84);
        background: linear-gradient(180deg, rgba(0, 110, 178, 0.95), rgba(0, 76, 130, 0.96));
        color: #ecfbff;
        font-family: 'BlackOpsOne', monospace;
        font-size: 11px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        padding: 0 12px;
        cursor: pointer;
      }

      .tier-header {
        width: min(88%, 520px);
        padding: 4px 10px;
      }

      .tier-title {
        font-size: 12px;
        letter-spacing: 0.8px;
        white-space: nowrap;
        text-wrap: nowrap;
      }

      .ui-card {
        height: 205px;
      }

      .map-thumbnail {
        height: 96px;
      }

      .card-info {
        padding: 4px 5px 4px 26px !important;
      }

      .card-title {
        font-size: 10px;
      }

      .card-status-text {
        display: -webkit-box;
        font-size: 9px;
        line-height: 1.1;
        opacity: 0.95;
        white-space: normal;
        overflow: hidden;
        text-overflow: ellipsis;

      }

      .button-group {
        gap: 12px;
        padding-top: 2px;
        margin-top: 0 !important;
        transform: translateY(0);
      }

      .action-btn {
        padding: 3px 0;
        font-size: 8px;
      }

      .carousel-dots {
        margin-top: 4px;
      }

    #world-select-overlay[data-os="ios"] .cards-grid {
      -webkit-overflow-scrolling: touch;
    }

    #world-select-overlay[data-force-mobile="true"] .cards-grid {
      touch-action: auto;
    }

    #world-select-overlay[data-mobile="true"] .commander-bar,
    #world-select-overlay[data-force-mobile="true"] .commander-bar {
      padding-left: 10px;
      padding-right: 10px;
    }

    #world-select-overlay[data-mobile="true"] .ws-settings-btn,
    #world-select-overlay[data-force-mobile="true"] .ws-settings-btn {
      height: 24px;
      font-size: 7px;
      width: 90px;
      letter-spacing: 0.5px;
    }

    #world-select-overlay[data-mobile="true"] .ui-card .button-group,

      margin-top: 8px !important;
      transform: translateY(2px);
    }

    /* FRONT STAGE — ROLE SELECTION */
    .ws-front-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100svh;
      min-height: 100svh;
      overflow: hidden;
      background: #000000;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ws-front-stage::before {
      content: '';
      position: absolute;
      inset: -8%;
      background: transparent;
      filter: blur(34px);
      opacity: 0;
      pointer-events: none;
    }

    .ws-front-stage::after {
      content: '';
      position: absolute;
      inset: 0;
      background: transparent;
      pointer-events: none;
      opacity: 0;
    }

    .ws-front-shell {
      position: absolute;
      left: 50%;
      top: 0;
      width: 1280px;
      min-height: 100svh;
      padding: 72px 20px 48px;
      transform: translateX(-50%) scale(1);
      transform-origin: top center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 1;
    }

    /* Page header */
    .ws-front-header {
      text-align: center;
      width: 100%;
    }
    .ws-front-title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }
    .ws-front-title-deco {
      flex: 1;
      max-width: 180px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(0,200,255,0.8));
    }
    .ws-front-title-deco.right {
      background: linear-gradient(90deg, rgba(0,200,255,0.8), transparent);
    }
    .ws-front-main-title {
      font-family: 'BlackOpsOne', monospace;
      font-size: 38px;
      letter-spacing: 6px;
      color: #3df4ff;
      text-shadow: 0 0 20px rgba(0,220,255,0.8), 0 0 50px rgba(0,160,255,0.4);
      margin: 0;
    }
    .ws-front-subtitle {
      font-size: 13px;
      letter-spacing: 1px;
      color: rgba(160,200,230,0.75);
      margin: 6px 0 0;
    }

    /* Card grid */
    .ws-front-grid {
      display: grid !important;
      grid-template-columns: minmax(0, 1fr);
      gap: 22px;
      width: 100%;
      max-width: 520px;
      margin-top: 42px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Base card */
    .ws-front-card {
      position: relative;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 44px 22px 20px;
      background: linear-gradient(170deg, rgba(14,24,44,0.97) 0%, rgba(6,10,24,0.99) 100%);
      border: 1px solid rgba(60,90,130,0.5);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      overflow: visible;
    }
    .ws-front-card:hover { transform: translateY(-5px); }

    /* Sci-fi corner brackets */
    .ws-front-card::before {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      border-style: solid;
    }
    .ws-front-card::before { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
    .ws-front-corner-tr {
      position: absolute; top: 8px; right: 8px;
      width: 18px; height: 18px;
      border-top: 2px solid; border-right: 2px solid;
    }
    .ws-front-corner-bl {
      position: absolute; bottom: 8px; left: 8px;
      width: 18px; height: 18px;
      border-bottom: 2px solid; border-left: 2px solid;
    }

    /* Attack theme */
    .ws-front-attack {
      border-color: rgba(220,50,30,0.45);
      box-shadow: 0 0 35px rgba(255,50,30,0.18), inset 0 0 60px rgba(255,50,30,0.04);
    }
    .ws-front-attack:hover {
      box-shadow: 0 0 55px rgba(255,50,30,0.32), inset 0 0 60px rgba(255,50,30,0.07);
    }
    .ws-front-attack::before, .ws-front-attack::after,
    .ws-front-attack .ws-front-corner-tr, .ws-front-attack .ws-front-corner-bl {
      border-color: rgba(255,70,45,0.9);
    }

    /* Defend theme */
    .ws-front-defend {
      border-color: rgba(0,170,240,0.45);
      box-shadow: 0 0 35px rgba(0,170,240,0.18), inset 0 0 60px rgba(0,170,240,0.04);
    }
    .ws-front-defend:hover {
      box-shadow: 0 0 55px rgba(0,190,255,0.32), inset 0 0 60px rgba(0,190,255,0.07);
    }
    .ws-front-defend::before, .ws-front-defend::after,
    .ws-front-defend .ws-front-corner-tr, .ws-front-defend .ws-front-corner-bl {
      border-color: rgba(0,200,255,0.9);
    }

    /* Multi theme */
    .ws-front-multi {
      border-color: rgba(161,130,75,0.5);
      box-shadow: 0 0 35px rgba(151,121,69,0.22), inset 0 0 60px rgba(137,111,65,0.07);
    }
    .ws-front-multi:hover {
      box-shadow: 0 0 45px rgba(181,146,84,0.34), inset 0 0 60px rgba(137,111,65,0.11);
    }
    .ws-front-multi::before, .ws-front-multi::after,
    .ws-front-multi .ws-front-corner-tr, .ws-front-multi .ws-front-corner-bl {
      border-color: rgba(181,146,84,0.92);
    }

    /* Floating emblem badge */
    .ws-front-emblem-wrap {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px; height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      z-index: 2;
      user-select: none;
    }
    .ws-front-emblem-close {
      font-family: 'BlackOpsOne', monospace;
      font-size: 22px;
      display: inline-block;
      line-height: 1;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.55);
    }
    .ws-front-emblem-wrap.ws-front-emblem-pulse .ws-front-emblem-close {
      animation: wsEmblemClosePulse 1.05s ease-in-out infinite;
    }
    @keyframes wsEmblemClosePulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.55);
      }
      50% {
        transform: scale(1.22);
        opacity: 0.78;
        text-shadow: 0 0 18px rgba(255, 255, 255, 0.9);
      }
    }
    .ws-front-attack .ws-front-emblem-wrap {
      background: radial-gradient(circle, rgba(180,25,8,0.95) 0%, rgba(110,15,4,0.98) 100%);
      border: 2px solid rgba(255,70,45,0.95);
      box-shadow: 0 0 22px rgba(255,55,35,0.65), 0 0 44px rgba(255,55,35,0.3);
      color: #ffb090;
    }
    .ws-front-defend .ws-front-emblem-wrap {
      background: radial-gradient(circle, rgba(0,90,190,0.95) 0%, rgba(0,55,130,0.98) 100%);
      border: 2px solid rgba(0,200,255,0.95);
      box-shadow: 0 0 22px rgba(0,175,255,0.65), 0 0 44px rgba(0,175,255,0.3);
      color: #80e8ff;
    }
    .ws-front-multi .ws-front-emblem-wrap {
      background: radial-gradient(circle, rgba(91,105,49,0.98) 0%, rgba(39,50,27,0.99) 100%);
      border: 2px solid rgba(194,169,83,0.95);
      box-shadow: 0 0 16px rgba(147,130,61,0.42), 0 0 30px rgba(80,83,38,0.24);
      color: #e0c878;
    }
    .ws-front-multi .ws-front-emblem-wrap.ws-front-soldier-emblem {
      top: -28px;
      width: 48px;
      height: 48px;
      border: 2px solid rgba(194,169,83,0.95);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(91,105,49,0.98) 0%, rgba(39,50,27,0.99) 100%);
      box-shadow: 0 0 12px rgba(147,130,61,0.34), 0 0 22px rgba(80,83,38,0.18);
      overflow: hidden;
    }
    .ws-front-multi .ws-front-soldier-emblem img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      display: block;
    }

    /* Card title */
    .ws-front-card-title {
      font-family: 'BlackOpsOne', monospace;
      font-size: 38px;
      letter-spacing: 4px;
      text-align: center;
      margin-bottom: 2px;
    }
    .ws-front-attack .ws-front-card-title  { color: #ff4a32; text-shadow: 0 0 18px rgba(255,55,35,0.6); }
    .ws-front-defend .ws-front-card-title  { color: #3df4ff; text-shadow: 0 0 18px rgba(0,210,255,0.6); }
    .ws-front-multi  .ws-front-card-title  { color: #eadfc9; text-shadow: 0 0 14px rgba(167,131,78,0.52); }

    /* Tagline row */
    .ws-front-tagline {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin-bottom: 14px;
    }
    .ws-front-tagline-line { flex: 1; height: 1px; }
    .ws-front-attack .ws-front-tagline-line { background: rgba(255,70,45,0.55); }
    .ws-front-defend .ws-front-tagline-line { background: rgba(0,200,255,0.55); }
    .ws-front-multi  .ws-front-tagline-line { background: rgba(176,141,86,0.58); }
    .ws-front-tagline-text {
      font-size: 10px;
      letter-spacing: 2px;
      font-weight: 600;
      white-space: nowrap;
      text-transform: uppercase;
    }
    .ws-front-attack .ws-front-tagline-text { color: rgba(255,120,80,0.9); }
    .ws-front-defend .ws-front-tagline-text { color: rgba(0,215,255,0.9); }
    .ws-front-multi  .ws-front-tagline-text { color: rgba(216,195,155,0.92); }

    /* Art area */
    .ws-front-art {
      width: 100%;
      height: 158px;
      border-radius: 4px;
      margin-bottom: 14px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      box-sizing: border-box;
    }
    .ws-front-art::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 100%, transparent 30%, rgba(0,0,0,0.5) 100%);
      pointer-events: none;
    }
    .ws-front-attack .ws-front-art {
      background: radial-gradient(ellipse at 50% 80%, rgba(180,35,10,0.4) 0%, rgba(8,4,14,0.85) 65%);
      border: 1px solid rgba(255,70,45,0.2);
    }
    .ws-front-defend .ws-front-art {
      background: radial-gradient(ellipse at 50% 80%, rgba(0,90,190,0.4) 0%, rgba(4,8,20,0.85) 65%);
      border: 1px solid rgba(0,200,255,0.2);
    }
    .ws-front-multi .ws-front-art {
      background: radial-gradient(ellipse at 50% 80%, rgba(122,95,60,0.34) 0%, rgba(14,11,8,0.88) 65%);
      border: 1px solid rgba(157,126,77,0.32);
    }

    /* Description */
    .ws-front-desc {
      font-size: 13px;
      line-height: 1.55;
      text-align: center;
      color: rgba(175,205,225,0.85);
      margin-bottom: 14px;
    }

    /* Bonuses header */
    .ws-front-bonuses-hdr {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin-bottom: 10px;
    }
    .ws-front-bonuses-hdr-line {
      flex: 1; height: 1px;
      background: rgba(80,110,150,0.4);
    }

    .ws-front-defend .ws-front-bonus-lbl { color: rgba(100,220,255,0.8); }

    .ws-front-select-btn {

    .ws-front-attack .ws-front-select-btn {

      border: 2px solid rgba(255,65,40,0.85);
      color: #fff;
      box-shadow: 0 0 22px rgba(255,50,30,0.3), inset 0 1px 0 rgba(255,140,110,0.2);
      text-shadow: 0 0 10px rgba(255,90,70,0.7);

    .ws-front-attack .ws-front-select-btn:hover {
      background: linear-gradient(180deg, rgba(210,40,18,0.97) 0%, rgba(150,18,8,1) 100%);

    }
    .ws-front-defend .ws-front-select-btn {
      background: linear-gradient(180deg, rgba(0,75,155,0.92) 0%, rgba(0,45,105,0.96) 100%);
      border: 2px solid rgba(0,200,255,0.85);
      color: #fff;
      box-shadow: 0 0 22px rgba(0,175,255,0.3), inset 0 1px 0 rgba(100,220,255,0.2);
      text-shadow: 0 0 10px rgba(0,200,255,0.7);
    }
    .ws-front-defend .ws-front-select-btn:hover {
      background: linear-gradient(180deg, rgba(0,98,195,0.97) 0%, rgba(0,65,140,1) 100%);
      box-shadow: 0 0 34px rgba(0,175,255,0.5), inset 0 1px 0 rgba(100,220,255,0.3);
    }
    .ws-front-multi .ws-front-select-btn {
      background: linear-gradient(180deg, rgba(108,82,45,0.95) 0%, rgba(77,58,31,0.98) 100%);
      border: 2px solid rgba(179,146,89,0.84);
      color: #f0e3ca;
      box-shadow: 0 0 22px rgba(151,121,69,0.24), inset 0 1px 0 rgba(226,207,145,0.2);
      text-shadow: 0 0 10px rgba(179,146,89,0.42);
    }
    .ws-front-multi .ws-front-select-btn:hover {
      background: linear-gradient(180deg, rgba(133,105,58,0.98) 0%, rgba(94,73,38,1) 100%);
      box-shadow: 0 0 30px rgba(179,146,89,0.36), inset 0 1px 0 rgba(226,207,145,0.3);
    }
    .ws-front-select-stack {
      width: min(92%, 360px);
      margin-top: auto;
      display: grid;
      gap: 8px;
      margin-left: auto;
      margin-right: auto;
    }
    .ws-front-select-sub {
      width: 100%;
      padding: 11px 12px;
      border-radius: 4px;
      font-family: 'BlackOpsOne', monospace;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid rgba(179,146,89,0.7);
      color: rgba(240,227,202,0.94);
      background: linear-gradient(180deg, rgba(108,82,45,0.95) 0%, rgba(77,58,31,0.98) 100%);
      text-shadow: 0 0 8px rgba(179,146,89,0.34);
    }
    .ws-front-select-sub:hover {
      border-color: rgba(226,207,145,0.95);
      box-shadow: 0 0 14px rgba(179,146,89,0.36);
      color: #fff3d0;
    }
    .ws-front-mode-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .ws-front-mode-card {
      min-height: 62px;
      border-radius: 6px;
      border: 1px solid rgba(179,146,89,0.7);
      background: linear-gradient(180deg, rgba(108,82,45,0.95) 0%, rgba(77,58,31,0.98) 100%);
      color: rgba(240,227,202,0.95);
      text-transform: uppercase;
      font-family: 'BlackOpsOne', monospace;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 8px 6px;

    .ws-front-mode-card:hover {
      border-color: rgba(226,207,145,0.95);
      box-shadow: 0 0 14px rgba(179,146,89,0.36);
      color: #fff3d0;

    .ws-front-select-sub:focus,
    .ws-front-mode-card:focus {
      outline: 2px solid rgba(226,207,145,0.9);
      outline-offset: 2px;

    .ws-front-role-choice-row .ws-mm-role-icon {
      visibility: hidden;
    }
    .ws-front-mode-card-main {
      font-size: 14px;
      letter-spacing: 1.4px;
      line-height: 1;
    }
    .ws-front-mode-card-sub {
      font-size: 8px;
      letter-spacing: 1px;
      opacity: 0.86;
      line-height: 1.1;
    }

    @media (max-width: 1024px) {
      .ws-front-shell {
        width: 100%;
        max-width: 100%;
        min-height: 100svh;
        padding: 42px 12px 18px;
        justify-content: center;
        gap: 12px;
      }
      .ws-front-grid {
        display: grid !important;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
        margin-top: 22px;
      }
      .ws-front-card {
        padding: 34px 10px 12px;
      }
      .ws-front-main-title {
        font-size: 28px;
        letter-spacing: 3px;
      }
      .ws-front-title-row {
        gap: 10px;
      }
      .ws-front-title-deco {
        max-width: 90px;
      }
      .ws-front-card-title {
        font-size: 30px;
      }
      .ws-front-tagline-text {
        font-size: 9px;
        letter-spacing: 1.2px;
      }
      .ws-front-art {
        height: 118px;
        margin-bottom: 10px;
      }
      .ws-front-desc {
        font-size: 11px;
        line-height: 1.35;
        margin-bottom: 10px;
      }
      .ws-front-bonuses-hdr {
        margin-bottom: 8px;
      }
      .ws-front-bonuses-hdr-label {
        font-size: 8px;
        letter-spacing: 1.5px;
        padding: 2px 8px;
      }
      .ws-front-bonuses {
        gap: 5px;
        margin-bottom: 10px;
      }
      .ws-front-bonus {
        padding: 6px 5px;
        gap: 4px;
      }
      .ws-front-bonus-val {
        font-size: 10px;
      }
      .ws-front-bonus-lbl {
        font-size: 7px;
        letter-spacing: 0.6px;
      }
      .ws-front-select-stack {
        width: 100%;

      }

        min-height: 56px;
      }

        font-size: 12px;

      }
      .ws-front-mode-card-sub {

      }

    @media (max-width: 640px) {
      .ws-front-grid {
        grid-template-columns: 1fr;
        max-width: 470px;
      }
      .ws-front-card {
        max-width: 470px;
        width: 100%;
        margin: 0 auto;
      }
    }

    /* SVG icon sizing */
    .ws-front-emblem-wrap svg { width: 32px; height: 32px; }
    .ws-front-art svg { width: 80px; height: 80px; opacity: 0.72; filter: drop-shadow(0 0 14px currentColor); }
    .ws-front-bonus-icon svg { width: 18px; height: 18px; }

    /* hidden attribute must win over display:flex on the front stage */
    .ws-front-stage[hidden] { display: none; }
    @keyframes wsCardIn    { from{opacity:0;transform:translateY(55px) scale(.93)} to{opacity:1;transform:translateY(0) scale(1)} }
    @keyframes wsHeaderIn  { from{opacity:0;letter-spacing:22px;filter:blur(6px)} to{opacity:1;letter-spacing:6px;filter:blur(0)} }
    @keyframes wsDecoIn    { from{max-width:0;opacity:0} to{max-width:180px;opacity:1} }
    @keyframes wsTagIn     { from{opacity:0;transform:scaleX(0)} to{opacity:.9;transform:scaleX(1)} }
    @keyframes wsBonusIn   { from{opacity:0;transform:translateX(-14px)} to{opacity:1;transform:translateX(0)} }
    @keyframes wsCornerFlk { 0%,78%,100%{opacity:1} 83%{opacity:.12} 90%{opacity:1} 95%{opacity:.35} }
    @keyframes wsBtnShimmer{ 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.28) drop-shadow(0 0 8px currentColor)} }
    @keyframes wsReticle   { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes wsBreathR   { 0%,100%{box-shadow:0 0 35px rgba(220,50,30,.18),inset 0 0 60px rgba(255,50,30,.04)} 50%{box-shadow:0 0 75px rgba(255,60,35,.5),inset 0 0 110px rgba(255,50,30,.13)} }
    @keyframes wsBreathB   { 0%,100%{box-shadow:0 0 35px rgba(0,170,240,.18),inset 0 0 60px rgba(0,170,240,.04)} 50%{box-shadow:0 0 75px rgba(0,200,255,.5),inset 0 0 110px rgba(0,170,240,.13)} }
    @keyframes wsBreathP   { 0%,100%{box-shadow:0 0 35px rgba(151,121,69,.22),inset 0 0 60px rgba(137,111,65,.07)} 50%{box-shadow:0 0 60px rgba(181,146,84,.38),inset 0 0 100px rgba(137,111,65,.12)} }
    @keyframes wsEmbR      { 0%,100%{box-shadow:0 0 22px rgba(255,55,35,.65),0 0 44px rgba(255,55,35,.3)} 50%{box-shadow:0 0 46px rgba(255,55,35,1),0 0 92px rgba(255,55,35,.68)} }
    @keyframes wsEmbB      { 0%,100%{box-shadow:0 0 22px rgba(0,175,255,.65),0 0 44px rgba(0,175,255,.3)} 50%{box-shadow:0 0 46px rgba(0,195,255,1),0 0 92px rgba(0,195,255,.68)} }
    @keyframes wsEmbP      { 0%,100%{box-shadow:0 0 16px rgba(147,130,61,.42),0 0 30px rgba(80,83,38,.24)} 50%{box-shadow:0 0 32px rgba(194,169,83,.72),0 0 58px rgba(80,83,38,.42)} }

    /* Header sweep-in */
    .ws-front-main-title { animation: wsHeaderIn .9s cubic-bezier(.22,1,.36,1) both; }
    .ws-front-title-deco { animation: wsDecoIn .85s .4s ease-out both; }

    /* Cards stagger in */
    .ws-front-attack { animation: wsCardIn .7s  .1s cubic-bezier(.22,1,.36,1) both; }
    .ws-front-defend { animation: wsCardIn .7s .28s cubic-bezier(.22,1,.36,1) both; }
    .ws-front-multi  { animation: wsCardIn .7s .46s cubic-bezier(.22,1,.36,1) both; }

    /* Emblem badges — static glow only (no pulse) */
    .ws-front-attack .ws-front-emblem-wrap { box-shadow: 0 0 22px rgba(255,55,35,.65), 0 0 44px rgba(255,55,35,.3); }
    .ws-front-defend .ws-front-emblem-wrap { box-shadow: 0 0 22px rgba(0,175,255,.65),  0 0 44px rgba(0,175,255,.3); }
    .ws-front-multi  .ws-front-emblem-wrap { box-shadow: 0 0 16px rgba(147,130,61,.42), 0 0 30px rgba(80,83,38,.24); }

    /* Attack reticle badge rotates slowly */
    .ws-front-attack .ws-front-emblem-wrap svg { animation: wsReticle 14s linear infinite; transform-box:fill-box; transform-origin:center; }

    /* Corner brackets flicker at staggered offsets */
    .ws-front-attack .ws-front-corner-tr { animation: wsCornerFlk 6s  .5s ease-in-out infinite; }
    .ws-front-attack .ws-front-corner-bl { animation: wsCornerFlk 6s 1.3s ease-in-out infinite; }
    .ws-front-defend .ws-front-corner-tr { animation: wsCornerFlk 6s 2.1s ease-in-out infinite; }
    .ws-front-defend .ws-front-corner-bl { animation: wsCornerFlk 6s 2.9s ease-in-out infinite; }
    .ws-front-multi  .ws-front-corner-tr { animation: wsCornerFlk 6s 3.7s ease-in-out infinite; }
    .ws-front-multi  .ws-front-corner-bl { animation: wsCornerFlk 6s 4.5s ease-in-out infinite; }

    /* Tagline text scale-in */
    .ws-front-tagline-text { animation: wsTagIn .5s .6s ease-out both; }

    /* Select button shimmer after entrance settles */
    .ws-front-select-btn { animation: wsBtnShimmer 2.8s 3s ease-in-out infinite; }

    /* Bonus rows slide in staggered */
    .ws-front-attack .ws-front-bonus:nth-child(1){animation:wsBonusIn .4s  .7s ease-out both}
    .ws-front-attack .ws-front-bonus:nth-child(2){animation:wsBonusIn .4s  .9s ease-out both}
    .ws-front-attack .ws-front-bonus:nth-child(3){animation:wsBonusIn .4s 1.1s ease-out both}
    .ws-front-defend .ws-front-bonus:nth-child(1){animation:wsBonusIn .4s  .9s ease-out both}
    .ws-front-defend .ws-front-bonus:nth-child(2){animation:wsBonusIn .4s 1.1s ease-out both}
    .ws-front-defend .ws-front-bonus:nth-child(3){animation:wsBonusIn .4s 1.3s ease-out both}
    .ws-front-multi  .ws-front-bonus:nth-child(1){animation:wsBonusIn .4s 1.1s ease-out both}
    .ws-front-multi  .ws-front-bonus:nth-child(2){animation:wsBonusIn .4s 1.3s ease-out both}
    .ws-front-multi  .ws-front-bonus:nth-child(3){animation:wsBonusIn .4s 1.5s ease-out both}

    /* ── SELECTION CONFIRMATION ANIMATIONS ──────────────── */
    @keyframes wsSelectFlash  { 0%{filter:brightness(1);transform:scale(1)} 18%{filter:brightness(4);transform:scale(1.07)} 55%{filter:brightness(2.2);transform:scale(1.04)} 100%{filter:brightness(1.6);transform:scale(1.02)} }
    @keyframes wsCardDim      { to{opacity:.06;transform:scale(0.91) translateY(14px);filter:blur(3px)} }
    @keyframes wsStageExit    { 0%{opacity:1;filter:brightness(1)} 20%{opacity:1;filter:brightness(2)} 100%{opacity:0;transform:scale(1.06);filter:brightness(0.1)} }
    @keyframes wsRingExpand   { from{transform:translate(-50%,-50%) scale(0);opacity:.95} to{transform:translate(-50%,-50%) scale(5.5);opacity:0} }
    @keyframes wsScreenFlash  { 0%{opacity:0} 12%{opacity:1} 100%{opacity:0} }
    .ws-card-selected { animation: wsSelectFlash .55s ease-out forwards !important; }
    .ws-card-dimmed   { animation: wsCardDim .4s .04s ease-out forwards !important; }
    .ws-stage-exit    { animation: wsStageExit .45s ease-in forwards; }
    .ws-select-ring   {
      position:absolute; width:80px; height:80px; border-radius:50%;
      border:3px solid; top:50%; left:50%; pointer-events:none; z-index:100;
      animation: wsRingExpand .65s ease-out forwards;
    }
    .ws-select-screen-flash {
      position:absolute; inset:0; z-index:200; pointer-events:none;
      border-radius:6px; animation: wsScreenFlash .45s ease-out forwards;
    }
    .ws-front-attack .ws-select-ring         { border-color:rgba(255,60,35,.9); }
    .ws-front-defend .ws-select-ring         { border-color:rgba(0,195,255,.9); }
    .ws-front-multi  .ws-select-ring         { border-color:rgba(194,169,83,.9); }
    .ws-front-attack .ws-select-screen-flash { background:rgba(255,60,35,.28); }
    .ws-front-defend .ws-select-screen-flash { background:rgba(0,195,255,.28); }
    .ws-front-multi  .ws-select-screen-flash { background:rgba(194,169,83,.22); }

    .ws-mm-modal {
      position: fixed;
      inset: 0;
      z-index: 360;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(6, 5, 4, 0.92);
      backdrop-filter: blur(2px);
      padding: 18px;
      box-sizing: border-box;
    }

    .ws-mm-panel {
      width: min(540px, 100%);
      border: 1px solid rgba(132, 119, 90, 0.42);
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(23, 20, 16, 0.98), rgba(14, 12, 10, 0.98));
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.62), 0 0 26px rgba(172, 140, 76, 0.18);
      padding: 12px;
      display: grid;
      gap: 8px;
      max-height: calc(100svh - 26px);
      overflow-y: auto;
      overscroll-behavior: contain;
      font-family: 'Teko', monospace;
    }

    .ws-mm-modal.match-ready .ws-mm-panel {
      width: min(1080px, calc(100vw - 36px));
    }

    .ws-mm-title {
      margin: 0;
      font-family: 'BlackOpsOne', monospace;
      font-size: 18px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: #e8dbc3;
    }

    .ws-mm-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .ws-mm-close {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      border: 1px solid rgba(134, 115, 84, 0.78);
      background: linear-gradient(180deg, #2e271d, #201b14);
      color: #ead7b2;
      font-family: 'BlackOpsOne', monospace;
      font-size: 16px;
      cursor: pointer;
      line-height: 1;
    }

    .ws-mm-sub {
      margin: 0;
      color: rgba(203, 182, 146, 0.92);
      font-size: 11px;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      font-family: 'Teko', monospace;
    }

    .ws-mm-waitfx {

      border: none;
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(29, 24, 18, 0.9), rgba(20, 16, 12, 0.92));
      padding: 8px 9px;
      gap: 6px;
      box-shadow: inset 0 0 6px rgba(170, 140, 84, 0.05);

    .ws-mm-waitfx.active {

      animation: wsWaitGlow 1.9s ease-in-out infinite;

    .ws-mm-picked-world {

      border-radius: 10px;
      background: rgba(24, 20, 15, 0.65);

      gap: 5px;

    .ws-mm-picked-world-label {
      color: #d3b983;

      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1;

    .ws-mm-picked-world-label.is-fading,

      animation: wsSelectionLabelFade 0.9s ease-out forwards;

    .ws-mm-picked-world-map {

      width: 100%;
      height: 100%;

      gap: 6px;

      letter-spacing: 1.1px;
      text-transform: uppercase;
      line-height: 1;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);

    .ws-mm-kickoff-map {
      width: 100%;
      height: clamp(190px, 44vh, 360px);
      max-height: 360px;
      border-radius: 10px;
      overflow: hidden;
      border: none;
      background: rgba(17, 14, 10, 0.88);
      box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.42);
    }

    .ws-mm-kickoff-map img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(0.78) brightness(0.78) contrast(1.02);
    }

    .ws-mm-kickoff-countdown {
      color: #efe1c8;
      font-family: 'BlackOpsOne', monospace;
      font-size: clamp(14px, 2.1vw, 20px);
      letter-spacing: 1px;
      line-height: 1;
      margin-top: 10px;

<script>
(function() {
  function detectClientPlatform() {
    const ua = navigator.userAgent || '';
    const platform = navigator.platform || '';
    const touchPoints = navigator.maxTouchPoints || 0;
    const params = new URLSearchParams(window.location.search || '');
    const forceMobileParam = params.get('forceMobile');
    const forceMobile = forceMobileParam === '1';

    const isElectron = /Electron/i.test(ua);
    const isIOS = /iPhone|iPad|iPod/i.test(ua) || (platform === 'MacIntel' && touchPoints > 1 && !isElectron);
    const isAndroid = /Android/i.test(ua) && !isElectron;
    const isWindows = /Win/i.test(platform) || /Windows/i.test(ua);
    const isMac = /Mac/i.test(platform) && !isIOS;
    const isLinux = /Linux/i.test(platform) && !isAndroid;

    let os = 'unknown';
    if (isIOS) os = 'ios';
    else if (isAndroid) os = 'android';
    else if (isElectron) os = 'electron';
    else if (isWindows) os = 'windows';
    else if (isMac) os = 'macos';
    else if (isLinux) os = 'linux';

    return {
      os,
      isMobile: !isElectron && (forceMobile || isIOS || isAndroid),
      forceMobile,
      touchPoints,
      ua
    };
  }

  function getAppPlatform() {
    if (!window.__appPlatform) {
      window.__appPlatform = detectClientPlatform();
    }
    return window.__appPlatform;
  }

  function isMobileViewport() {
    const platformMobile = Boolean(window.__appPlatform?.isMobile);
    const forceMobile = Boolean(window.__appPlatform?.forceMobile || document.body?.dataset?.forceMobile === 'true');
    const narrowViewport = window.matchMedia('(max-width: 1024px)').matches;
    const compactLandscape = window.matchMedia('(orientation: landscape) and (max-height: 500px)').matches;
    const coarsePointer = window.matchMedia('(pointer: coarse)').matches;
    return forceMobile || platformMobile || narrowViewport || (coarsePointer && compactLandscape);
  }

  function isCompactCarouselMode() {
    const params = new URLSearchParams(window.location.search || '');
    const compactCarouselParam = params.get('compactCarousel');
    if (compactCarouselParam === '0') {
      return false;
    }
    if (compactCarouselParam === '1') {
      return true;
    }
    return true;
  }

  function isDevUnlockAllWorldsEnabled() {
    const params = new URLSearchParams(window.location.search || '');
    if (params.get('unlockAllTiers') === '1' || params.get('devUnlockAllWorlds') === '1') return true;
    try { return localStorage.getItem('tdDevUnlockAllWorlds') === '1'; } catch(e) { return false; }
  }

  function applyOverlayPlatformAttributes() {
    const overlay = document.getElementById('world-select-overlay');
    if (!overlay) return;

    const platform = getAppPlatform();
    overlay.setAttribute('data-os', platform.os);
    overlay.setAttribute('data-mobile', platform.isMobile ? 'true' : 'false');
    overlay.setAttribute('data-force-mobile', platform.forceMobile ? 'true' : 'false');
  }

  function loadWorldSelectModePrefs() {
    const defaults = {
      mode: 'singleplayer',
      multiplayerRole: 'defender',
      multiplayerVariant: 'nearby',
    };
    try {
      const raw = localStorage.getItem('tdWorldSelectModePrefs');
      if (!raw) {
        return defaults;
      }
      const parsed = JSON.parse(raw);
      const mode = parsed?.mode === 'vsAiDefense' || parsed?.mode === 'vsAiAttack'
        ? parsed.mode
        : (parsed?.mode === 'vsAi' || (parsed?.mode === 'multiplayer' && parsed?.multiplayerVariant === 'ai')
          ? (parsed?.multiplayerRole === 'enemyCommander' ? 'vsAiAttack' : 'vsAiDefense')
          : 'singleplayer');
      const normalizedMode = mode === 'singleplayer' || mode === 'multiplayer'
        ? mode
        : (mode === 'vsAiAttack' ? 'vsAiAttack' : 'vsAiDefense');
      const multiplayerRole = parsed?.multiplayerRole === 'defender'
        ? 'defender'
        : 'enemyCommander';
      const multiplayerVariant = normalizedMode === 'singleplayer'
        ? 'nearby'
        : (parsed?.multiplayerVariant === 'ai'
          ? 'ai'
          : (parsed?.multiplayerVariant === 'nearby' ? 'nearby' : 'online'));
      return {
        mode: normalizedMode,
        multiplayerRole,
        multiplayerVariant,
      };
    } catch (_) {
      return defaults;
    }
  }

  function saveWorldSelectModePrefs(nextPrefs) {
    try {
      const mode = nextPrefs.mode === 'vsAiDefense' || nextPrefs.mode === 'vsAiAttack'
        ? nextPrefs.mode
        : (nextPrefs.mode === 'vsAi' || (nextPrefs.mode === 'multiplayer' && nextPrefs.multiplayerVariant === 'ai')
          ? (nextPrefs.multiplayerRole === 'enemyCommander' ? 'vsAiAttack' : 'vsAiDefense')
          : 'singleplayer');
      const normalizedMode = mode === 'singleplayer' || mode === 'multiplayer'
        ? mode
        : (mode === 'vsAiAttack' ? 'vsAiAttack' : 'vsAiDefense');
      localStorage.setItem('tdWorldSelectModePrefs', JSON.stringify({
        mode: normalizedMode,
        multiplayerRole: normalizedMode === 'singleplayer'
          ? 'defender'
          : (nextPrefs.multiplayerRole === 'defender'
          ? 'defender'
          : 'enemyCommander'),
        multiplayerVariant: normalizedMode === 'singleplayer'
          ? 'nearby'
          : (nextPrefs.multiplayerVariant === 'ai'
            ? 'ai'
            : (nextPrefs.multiplayerVariant === 'nearby' ? 'nearby' : 'online')),
      }));
    } catch (_) {}
  }

  function loadAttackCommanderData() {
    try {
      const raw = localStorage.getItem('tdAttackCommanderV1');
      if (!raw) return { level: 1, wins: 0, worldsCleared: [] };
      const parsed = JSON.parse(raw);
      return {
        level: Math.max(1, Number(parsed?.level) || 1),
        wins: Math.max(0, Number(parsed?.wins) || 0),
        worldsCleared: Array.isArray(parsed?.worldsCleared) ? parsed.worldsCleared.slice() : [],
      };
    } catch (_) {
      return { level: 1, wins: 0, worldsCleared: [] };
    }
  }

  const WORLD_SELECT_ONLINE_WS_URL_STORAGE_KEY = 'blastova.onlineMatchmaking.wsUrl';
  const WORLD_SELECT_ONLINE_WS_URL_DEFAULT = 'wss://blastova-matchmaker-production.up.railway.app';
  const WORLD_SELECT_NEARBY_WS_URL_STORAGE_KEY = 'blastova.nearbyMatchmaking.wsUrl';
  const WORLD_SELECT_NEARBY_WS_URL_DEFAULT = 'ws://192.168.4.1:8787';

  function normalizeMatchmakingTransport(value) {
    return value === 'nearby' ? 'nearby' : 'online';
  }

  function normalizeMatchWsUrl(raw, transport) {
    const fallback = normalizeMatchmakingTransport(transport) === 'nearby'
      ? WORLD_SELECT_NEARBY_WS_URL_DEFAULT
      : WORLD_SELECT_ONLINE_WS_URL_DEFAULT;
    const input = String(raw || '').trim();
    if (!input) return fallback;

    let candidate = input;
    try {
      if (!candidate.includes('://')) {
        if (/^[A-Za-z0-9_-]{12,}$/.test(candidate)) {
          const pad = '==='.slice((candidate.length + 3) % 4);
          const decoded = atob(candidate.replace(/-/g, '+').replace(/_/g, '/') + pad);
          if (decoded && decoded.includes('://')) {
            candidate = decoded;
          }
        }
      }
    } catch (_) {}

    if (!candidate.includes('://')) {
      if (/^\d+\.\d+\.\d+\.\d+$/.test(candidate)) {
        candidate = 'ws://' + candidate + ':8787';
      } else {
        candidate = 'ws://' + candidate;
      }
    }

    try {
      const parsed = new URL(candidate);
      const protocol = parsed.protocol === 'wss:' ? 'wss:' : 'ws:';
      const host = parsed.hostname;
      const port = parsed.port || (protocol === 'wss:' ? '443' : '8787');
      const pathname = parsed.pathname && parsed.pathname !== '/' ? parsed.pathname : '';
      return protocol + '//' + host + ':' + port + pathname;
    } catch (_) {
      return fallback;
    }
  }

  function encodeNearbyCode(wsUrl) {
    try {
      return btoa(String(wsUrl || ''))
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/g, '');
    } catch (_) {
      return '';
    }
  }

  function buildMatchmakingInviteText(matchmaking) {
    const inviteBuilder = window.__tdEncodeMultiplayerInvite;
    const wsUrl = resolveWorldSelectMatchWsUrl(matchmaking.selectedTransport);
    if (typeof inviteBuilder === 'function') {
      return inviteBuilder({
        transport: matchmaking.selectedTransport,
        wsUrl,
        role: matchmaking.selectedRole || 'defender',
        worldId: matchmaking.selectedWorldId,
        difficulty: matchmaking.selectedDifficulty,
        matchId: matchmaking.match?.matchId || '',
        host: !!matchmaking.match?.host,
      });
    }
    return wsUrl;
  }

  async function renderMatchmakingInviteQr(ui, matchmaking) {
    if (!ui || !ui.inviteWrap || !ui.inviteQrCode) return;
    const isNearby = matchmaking.selectedTransport === 'nearby';
    const qrCode = isNearby && ui.tacticalNearbyQrCode
      ? ui.tacticalNearbyQrCode
      : ui.inviteQrCode;
    const inviteText = buildMatchmakingInviteText(matchmaking);
    const qrCacheKey = isNearby
      ? ['nearby', matchmaking.selectedRole, matchmaking.selectedWorldId, matchmaking.selectedDifficulty, resolveWorldSelectMatchWsUrl('nearby')].join('|')
      : inviteText;
    matchmaking.inviteText = inviteText;
    ui.inviteWrap.style.display = 'grid';
    if (ui.inviteText) {
      ui.inviteText.textContent = isNearby
        ? 'Nearby invite: scan this QR from the other device or copy the invite text.'
        : 'Online invite: scan this QR from the other device or copy the invite text.';
    }
    if (ui.inviteRaw) {
      ui.inviteRaw.value = inviteText;
    }
    if (matchmaking.inviteQrText === qrCacheKey) return;
    matchmaking.inviteQrText = qrCacheKey;
    qrCode.innerHTML = '<div class="ws-mm-qr-fallback">Generating QR...</div>';
    const qrGenerator = window.__tdGenerateMultiplayerInviteQrSvg;
    if (typeof qrGenerator !== 'function') {
      qrCode.innerHTML = '<div class="ws-mm-qr-fallback">QR unavailable.</div>';
      return;
    }
    try {
      const svg = await qrGenerator(inviteText);
      if (matchmaking.inviteQrText !== qrCacheKey) return;
      qrCode.innerHTML = svg;
    } catch (_) {
      if (matchmaking.inviteQrText === qrCacheKey) {
        qrCode.innerHTML = '<div class="ws-mm-qr-fallback">QR generation failed.</div>';
      }
    }
  }

  function setWorldSelectMatchWsUrl(transport, value) {
    const normalizedTransport = normalizeMatchmakingTransport(transport);
    const normalizedUrl = normalizeMatchWsUrl(value, normalizedTransport);
    try {
      const storageKey = normalizedTransport === 'nearby'
        ? WORLD_SELECT_NEARBY_WS_URL_STORAGE_KEY
        : WORLD_SELECT_ONLINE_WS_URL_STORAGE_KEY;
      localStorage.setItem(storageKey, normalizedUrl);
    } catch (_) {}
    return normalizedUrl;
  }

  function resolveWorldSelectMatchWsUrl(transport) {
    const normalizedTransport = normalizeMatchmakingTransport(transport);
    const storageKey = normalizedTransport === 'nearby'
      ? WORLD_SELECT_NEARBY_WS_URL_STORAGE_KEY
      : WORLD_SELECT_ONLINE_WS_URL_STORAGE_KEY;
    const fallback = normalizedTransport === 'nearby'
      ? WORLD_SELECT_NEARBY_WS_URL_DEFAULT
      : WORLD_SELECT_ONLINE_WS_URL_DEFAULT;
    try {
      const saved = String(localStorage.getItem(storageKey) || '').trim();
      if (saved) return normalizeMatchWsUrl(saved, normalizedTransport);
    } catch (_) {}
    return fallback;
  }

  function closeWorldSelectMatchmaking(state) {
    if (!state) return;
    try {
      if (state.socket && state.socket.readyState === WebSocket.OPEN) {
        state.socket.send(JSON.stringify({ type: 'lobby_leave' }));
      }
    } catch (_) {}
    try {
      if (state.socket && (state.socket.readyState === WebSocket.OPEN || state.socket.readyState === WebSocket.CONNECTING)) {
        state.socket.close(1000, 'world-select-close');
      }
    } catch (_) {}
    state.socket = null;
    if (state.statsPollTimer) {
      clearInterval(state.statsPollTimer);
      state.statsPollTimer = 0;
    }
    if (state.reconnectTimer) {
      clearTimeout(state.reconnectTimer);
      state.reconnectTimer = 0;
    }
    if (state.waitFxTimer) {
      clearInterval(state.waitFxTimer);
      state.waitFxTimer = 0;
    }
    if (state.preStartTimer) {
      clearInterval(state.preStartTimer);
      state.preStartTimer = 0;
    }
    state.waitSince = 0;
    state.onlineSearchSince = 0;
    state.preStartCountdownActive = false;
    state.preStartCountdownEndsAt = 0;
    state.preStartCountdownSeconds = 0;
    state.preStartAutoStartHost = false;
    state.preStartLaunchConfig = null;
    state.connected = false;
    state.browsing = false;
    state.matched = false;
    state.match = null;
    state.pendingLaunch = false;
    state.lobbies = [];
    state.selectedLobbyId = '';
    state.hostingLobby = false;
    state.roleOnly = false;
  }
