name: Build Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Fails the run before anything builds if the tag, package.json and Android versionName disagree.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and verify version
        id: resolve
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          ANDROID_VERSION=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android/app/build.gradle)

          echo "package.json:  $PKG_VERSION"
          echo "build.gradle:  $ANDROID_VERSION"

          if [ "$PKG_VERSION" != "$ANDROID_VERSION" ]; then
            echo "::error::Version mismatch: package.json=$PKG_VERSION android=$ANDROID_VERSION"
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "tag:           $TAG_VERSION"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $PKG_VERSION"
              exit 1
            fi
          fi

          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build macOS DMG
        run: npm run ensure:electron && npm run build && npx electron-builder --mac dmg --publish never
      
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            dist/Blastova-*.dmg
            dist/Blastova-*.dmg.blockmap

  build-windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Windows NSIS
        run: npm run ensure:electron && npm run build && npx electron-builder --win nsis --publish never
      
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/Blastova*.exe
            dist/Blastova*.exe.blockmap

  build-linux:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libxss1

      - name: Install dependencies
        run: npm ci
      
      - name: Build Linux AppImage
        run: npm run ensure:electron && npm run build && npx electron-builder --linux AppImage --publish never
      
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/Blastova*.AppImage
            dist/Blastova*.AppImage.blockmap

  build-android:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Vite assets
        run: npm run build

      # Generates android/capacitor-cordova-android-plugins/, which is gitignored.
      - name: Sync Capacitor Android project
        run: npx cap sync android
      
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set; the APK would be unsigned."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/blastova-release.keystore

          # Pasted secrets often carry a trailing newline/CR, which breaks the alias lookup.
          STORE_PASSWORD=$(printf '%s' "$STORE_PASSWORD" | tr -d '\r\n')
          KEY_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')
          KEY_PASSWORD=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')

          printf 'storeFile=app/blastova-release.keystore\n' > android/keystore.properties
          printf 'storePassword=%s\n' "$STORE_PASSWORD" >> android/keystore.properties
          printf 'keyAlias=%s\n' "$KEY_ALIAS" >> android/keystore.properties
          printf 'keyPassword=%s\n' "$KEY_PASSWORD" >> android/keystore.properties

          echo "Aliases present in keystore:"
          keytool -list -keystore android/app/blastova-release.keystore \
            -storepass "$STORE_PASSWORD" 2>/dev/null | grep -i "^blastova\|PrivateKeyEntry" || true
      
      - name: Build Android APK
        working-directory: ./android
        run: ./gradlew assembleRelease
      
      - name: Verify APK is signed
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" \
            || { echo "::error::APK failed signature verification"; exit 1; }
      
      - name: Remove signing material
        if: always()
        run: rm -f android/keystore.properties android/app/blastova-release.keystore
      
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: android/app/build/outputs/apk/release/app-release.apk

  create-release:
    needs: [check-version, build-macos, build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Blastova ${{ needs.check-version.outputs.version }}
          files: |
            macos-artifacts/*
            windows-artifacts/*
            linux-artifacts/*
            android-artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
